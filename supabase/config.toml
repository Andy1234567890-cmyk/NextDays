# supabase/config.toml — Konfiguration des LOKALEN Supabase-Stacks
#
# Wird von der Supabase CLI gelesen. Start (macht Andy, nicht Claude):
#   supabase start
# Das zieht Postgres, Auth (GoTrue), Storage, Studio und die REST-API
# als lokale Docker-Container hoch. Diese Datei wurde manuell angelegt
# (kein `supabase init`-Aufruf nötig).

project_id = "nextdays"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
# Lokaler Mail-Catcher für Auth-Mails (Bestätigung/Reset) im Dev.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false  # Dev: keine Mail-Bestätigung nötig

[analytics]
enabled = false
