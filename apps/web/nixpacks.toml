# Nixpacks-Build-Konfiguration für die Web-App (Coolify, build_pack=nixpacks).
#
# Grund: Das Nixpacks-Basis-Image bringt ein veraltetes corepack (0.24.1) mit,
# das die in package.json deklarierte pnpm-Version (11.1.1) unter Node 22 nicht
# laden kann (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING). corepack ist das offizielle
# Node-Werkzeug, um die unter "packageManager" festgelegte pnpm-Version
# bereitzustellen — wir installieren hier nur eine dazu passende corepack-Version
# (fest gepinnt für reproduzierbare Builds) und aktivieren pnpm vor der
# Installation. Kein Workaround, sondern der vorgesehene Konfig-Weg.
[phases.install]
cmds = [
  "npm install -g corepack@0.34.0",
  "corepack enable",
  "corepack prepare pnpm@11.1.1 --activate",
  "pnpm install --frozen-lockfile",
]
