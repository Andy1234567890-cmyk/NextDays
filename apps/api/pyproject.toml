# apps/api/pyproject.toml — FastAPI-Backend (Vertical Slice Architecture)

[project]
name = "nextdays-api"
version = "0.1.0"
description = "NextDays FastAPI-Backend — gesamte Business-Logik"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2", # Config-Laden mit SecretStr (>=2.14.2: GHSA-4xgf-cpjx-pc3j)
    "supabase>=2.9",            # Supabase-Client (Postgres/Auth/Storage)
    "redis>=5.2",               # Caching + Background-Queue
    "structlog>=24.4",          # strukturiertes Logging
    "python-multipart>=0.0.12", # Form-/Datei-Uploads (z. B. OCR)
    "pyjwt>=2.9",               # Supabase-JWT-Verifikation (HS256)
    "email-validator>=2.2",     # Pydantic EmailStr
    "pyotp>=2.9",               # TOTP-2FA (Authenticator-App, kein SMS-Dienst)
    "qrcode[pil]>=8.0",         # QR-Code (otpauth-URI) für die App-Einrichtung
    "stripe>=15.3.0",            # Stripe Connect (Marketplace-Zahlungen)
    "pillow>=12.3.0",           # transitiv via qrcode[pil]; >=12.3.0 schließt 8 CVEs (PYSEC-2026-*)
    "nh3>=0.2.18",              # HTML-Sanitizer (Rust/ammonia) für gast-sichtbares Rich-Text
    "twilio>=9.10.9",
    # Push an die Mobile-Apps (FCM HTTP v1, Migration 0414). Das offizielle
    # SDK statt eines eigenen HTTP-Aufrufs wegen der TYPISIERTEN Fehler je
    # Token (UnregisteredError, SenderIdMismatchError, QuotaExceededError):
    # nur damit laesst sich ein abgemeldetes Geraet gezielt loeschen
    # (Wurzel 1) und ein Kontroll-Signal spezifisch fangen (Wurzel 5).
    # Ein Eigenbau muesste dafuer JSON-Fehlerstrings parsen.
    # Preis: ~150 MB transitive Abhaengigkeiten (grpcio, google-cloud-*),
    # von denen nur der messaging-Teil genutzt wird — bewusst in Kauf
    # genommen, ein FCM-only-Extra bietet das SDK nicht an.
    "firebase-admin>=6.5",
    # AES-GCM fuer die OAuth-Token verbundener Partner-Konten (0521) und die
    # Signatur des OAuth-state. Bisher nur transitiv (firebase-admin/pyjwt) —
    # explizit, damit ein Wegfall dort die Kanalanbindung nicht still killt.
    "cryptography>=43",
    "holidays>=0.103",
    "ortools>=9.15.6755",
    "pyairbnb>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",              # TestClient für FastAPI
    "ruff>=0.7",
    "pylint>=4.0",              # logische Prüfungen, CI-Guard hält 10.00/10
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, B: bugbear, UP: pyupgrade,
# ANN: type annotations (gegen Any-Schludrigkeit), S: bandit (Security)
select = ["E", "F", "I", "B", "UP", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
# assert + lockere Annotations + Test-Passwörter (keine echten Secrets) erlaubt
"**/tests/*" = ["S101", "S105", "S106", "ANN"]
# Template-Datenmodul: lange lokalisierte Marketing-Texte/HTML nicht umbrechen.
"**/site_config/templates.py" = ["E501"]
# Mailkatalog des Partnerprogramms: 24 Sprachfassungen je Satz, maschinell
# erzeugt — Umbrüche in Übersetzungen wären Wartungsrauschen, keine Lesbarkeit.
"**/mail_texte_partner.py" = ["E501"]
"**/mail_texte_personal.py" = ["E501"]

[tool.pylint.main]
# Ruff (oben) ist der primäre Linter (Stil, Imports, Bugbear, Security,
# Annotations). Pylint ergänzt nur die logischen Prüfungen. Reine
# Konventions-/Stil-Checks, die Ruff bereits abdeckt oder die mit den
# FastAPI-/Pydantic-Idiomen kollidieren, werden hier abgeschaltet, damit
# Pylint die echten Befunde sauber meldet.
py-version = "3.12"
ignore-paths = ["^.*/tests/.*$"]
# redis-py exponiert `redis` und `redis.asyncio` über eine dynamische Submodul-
# Struktur, die astroid statisch nicht auflösen kann (falscher E0401). Das Paket
# ist real installiert (redis>=5.2) und importiert zur Laufzeit sauber — nur die
# statische Analyse stolpert. Gezielt ignorieren, damit kein Falsch-Positiv die
# 10.00 drückt (sync-Client im Worker-Budget, async-Client im HTTP-Limiter).
# nh3 ist ein Rust-Extension-Modul (ammonia-Binding); astroid kann `nh3.clean`
# statisch nicht auflösen (falscher E1101). Real installiert (nh3>=0.2.18).
ignored-modules = ["redis", "redis.asyncio", "nh3"]

[tool.pylint.format]
max-line-length = 100
# channel_manager/service.py ist seit dem Mixin-Split (common + 6 Domänen-
# Module) unter 1000 Zeilen — das frühere 3000er-Limit ist eingelöst. Drei
# Bestands-Services (vertikale Slices) liegen darüber: buchhaltung 1401,
# owner_statements 1377, reservations 1265, inbox 1246.
# TODO(god-files): diese Services in Teilmodule splitten und Limit wieder
# Richtung Default (1000) senken.
max-module-lines = 1500

[tool.pylint.basic]
# StrEnum-Member werden klein geschrieben (direct, pending, ferienhaus …).
# Pylint wertet sie als Konstanten und verlangt UPPER_CASE. Wir erlauben für
# Konstanten BEIDE Stile (UPPER_CASE für echte Modul-Konstanten, snake_case für
# Enum-Member). Klassen-Attribute frei (deckt ebenfalls Enum-Member ab).
class-attribute-naming-style = "any"
const-naming-style = "any"
class-const-naming-style = "any"

[tool.pylint.variables]
# FastAPI-Idiom: Pfad-Parameter und injizierte Dependencies stehen ZWINGEND in
# der Endpunkt-Signatur (sonst registriert FastAPI die Route nicht bzw. bindet
# das Pfad-Segment nicht), werden im Body aber oft nicht gelesen:
#   - ctx:      Auth-/Autorisierungs-Dependency (Seiteneffekt 401/403)
#   - request:  Raw-Request bei Stub-/No-Op-Endpunkten
#   - service:  injizierter Service, bei reinen Stub-Routen ungenutzt
#   - company_id/user_id: Pfad-Kompat fürs Frontend; autoritativ ist der
#     JWT-Tenant (im Service via RLS/Tenant-Scope), nicht der Pfad
#   - app:      Signatur des FastAPI-Lifespan-Contextmanagers
# Daher als bewusst-ignorierte Argumentnamen geführt (Default `_`-Präfix bleibt).
ignored-argument-names = "_.*|^ignored_|^unused_|ctx|request|service|company_id|user_id|app"

[tool.pylint."messages control"]
disable = [
    # Docstring-Zwang: Ruff/Projektstil regeln Doku; Modul-Docstrings sind da,
    # triviale Health-/Schema-Funktionen brauchen keinen.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Pydantic-Schemas & Service-/Health-Klassen haben bewusst wenige Methoden.
    "too-few-public-methods",
    # Gemeinsame Enum-Werte (z. B. Kanal-Namen) sind absichtlich identisch.
    "duplicate-code",
    # FastAPI-Factory: lokales `app` vs. Modul-`app` ist idiomatisch.
    "redefined-outer-name",
    # Pydantic v2: `Model.model_fields` IST iterierbar (dict) — Pylint-Fehlalarm.
    "not-an-iterable",
    # `value == []` in Tests ist als Lesbarkeits-Assertion gewollt.
    "use-implicit-booleaness-not-comparison",
    # Lokale Imports (z. B. timedelta in einer Methode) sind hier bewusst.
    "import-outside-toplevel",
    # Reine Refactoring-Heuristiken (Metrik-Schwellen) — KEINE Bugs. In einem
    # Vertical-Slice-Backend mit reichen Domänen-Services (Channex-ARI-Sync mit
    # vielen Restriktions-Parametern, mehrspaltige DB→Schema-Mappings, breite
    # Service-Fassaden je Slice) sind die Default-Grenzen zu eng; das Zerschneiden
    # funktionierender, getesteter Methoden allein zur Metrik-Erfüllung brächte
    # keinen Qualitätsgewinn und Risiko. Ruff (E/F/B/UP/ANN/S) + die echten
    # Pylint-Logikprüfungen (E11xx, no-member, …) sichern die Codequalität.
    "too-many-locals",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
    "too-many-branches",
    "too-many-instance-attributes",
    # Zyklus inbox.service ↔ inbox.scheduler ist bewusst und wird auf BEIDEN
    # Seiten per Lazy-Import (in der Methode) gebrochen — zur Laufzeit kein
    # Zyklus. Pylint meldet ihn statisch (irreführend auf guests/identity.py).
    "cyclic-import",
    # Best-effort-/Non-blocking-Catch-alls sind ein bewusstes Architekturmuster:
    # Channex-Push, Scheduler-/Cron-Dispatch, App-Start-Retry und Webhook-JSON-
    # Parsing dürfen die Hauptoperation NIE blockieren und müssen daher jede
    # Exception schlucken (geloggt, nicht weitergereicht). Jede Stelle ist im
    # Code mit `# noqa: BLE001` + 1-Zeilen-Begründung markiert; Ruffs `BLE`-Regel
    # bleibt aktiv und erzwingt diese Markierung. Eng-gefangene erwartbare Fehler
    # (ChannexError o. Ä.) werden weiterhin konkret behandelt.
    "broad-exception-caught",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
# rootdir (apps/api) auf den Import-Pfad, damit Tests unter tests/ `import src`
# auflösen (src/-Tests finden es über die Paketstruktur, tests/-Tests nicht).
pythonpath = ["."]
# Integration-Tests standardmäßig DESELEKTIEREN (Positiv-Gate): ein nackter
# `pytest` trifft nie ein externes System. Bewusst anfordern mit
# `pytest -m integration` UND `ALLOW_INTEGRATION_TESTS=1` (siehe conftest).
addopts = "-m 'not integration'"
markers = [
    "integration: registriert echte Tenants/Channex-Gruppen — nur mit ALLOW_INTEGRATION_TESTS=1 und explizit `-m integration`",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
