name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Zwei Bedingungen, UND-verknuepft: „@claude steht drin" UND „der Schreiber
    # gehoert dazu".
    #
    # Warum die zweite noetig ist: der Ausloeser ist ein KOMMENTAR, kein Push.
    # Wer im Repo kommentieren darf, startet damit einen Lauf mit
    # `secrets.CLAUDE_CODE_OAUTH_TOKEN` im Kontext — ohne eine Zeile Code
    # beizutragen und ohne Spur in der Branch-Historie. Das Repo ist privat,
    # der Kreis also ohnehin klein; aber genau dieser Kreis hat sich am
    # 18.09.2026 fuer 13 Stunden um einen externen Mitarbeiter erweitert, und
    # dieser Weg stand ihm offen. Autorisierung gehoert nicht an die
    # Zugehoerigkeit zum Repo, sondern an die Rolle (Wurzel 9).
    #
    # OWNER/MEMBER/COLLABORATOR — NICHT CONTRIBUTOR: „Contributor" heisst nur,
    # dass schon einmal ein Commit von dieser Person gemergt wurde, und das
    # gilt auch nach dem Entzug aller Rechte weiter.
    #
    # `author_association` sitzt je Ereignis an einem anderen Ort (comment /
    # review / issue) — deshalb steht die Pruefung viermal statt einmal.
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

