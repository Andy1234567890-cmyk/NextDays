name: CI

on:
  push:
    branches: [main]
  pull_request:

# Der Deploy-Job hängt an den Prüf-Jobs (needs) — deshalb liegt er in DIESEM
# Workflow und nicht mehr in einer eigenen deploy.yml. Als getrennter Workflow
# lief er unabhängig weiter und schickte auch bei rotem CI jeden main-Push an
# Coolify (belegt: zwei Deploys am 30.07. mit failing CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: uv installieren
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Abhängigkeiten installieren
        # In ein venv statt `--system`: der Runner-Interpreter unter /usr ist
        # extern verwaltet (PEP 668) und lehnt Installationen ab. Das venv-bin
        # in GITHUB_PATH macht ruff/pylint/pytest in den Folgeschritten sichtbar.
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src

      - name: Lint (pylint 10/10)
        # Hält die saubere 10.00/10 dauerhaft: bricht ab, sobald das Rating
        # unter 10 fällt (neue echte Befunde). Bewusste Ausnahmen sind zentral
        # in pyproject.toml [tool.pylint.*] begründet.
        run: pylint --fail-under=10 src

      - name: Tests (pytest)
        # Platzhalter-Werte, keine echten Secrets: die Tests sprechen kein
        # Supabase an, der Client wird aber beim Import konstruiert und lehnt
        # einen leeren Key ab. Lokal kommen die Werte aus apps/api/.env.
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
        run: pytest -q

  # Geteilte Pakete (packages/@nextdays/*): die Frontends prüfen nur, was sie
  # importieren — ungenutzter geteilter Code bliebe sonst ungeprüft.
  packages:
    name: Packages (Typprüfung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Typprüfung
        run: bunx tsc -p packages

  # Typprüfung je Frontend — schnelles, präzises Signal VOR den langsamen
  # Image-Builds. Der Produktions-Build läuft für die deployten Apps im
  # images-Job (dort exakt wie Coolify baut), nicht doppelt hier.
  # bun-Workspaces (Wurzel-package.json): eine Installation deckt alle ab.
  frontends:
    name: Frontend-Typprüfung (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, marketing, plattform, gastgeber, admin, builder, storybook]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Typprüfung
        working-directory: ${{ matrix.app }}
        run: bun run typecheck

      - name: Produktions-Build
        # Nur builder: die App hat (noch) keine Coolify-Resource, ihr Build wird
        # also nirgends sonst geprüft. Alle übrigen Frontends bauen im
        # images-Job über ihr Dockerfile — dort ist der Next-Build enthalten.
        if: matrix.app == 'builder'
        working-directory: ${{ matrix.app }}
        run: bun run build

  # Mobile hängt nicht am Wurzel-Workspace (React Native braucht sein eigenes,
  # nicht gehobenes node_modules), nutzt aber denselben Paketmanager: bun
  # mit eigenem mobile/bun.lock.
  mobile:
    name: Mobile (Typprüfung + Lint + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Platzhalter-Secrets anlegen
        # lib/config.secrets.ts ist gitignoriert (echter anon-Key), wird aber von
        # lib/config.ts importiert. Ohne die Datei bricht tsc mit TS2307 ab. Die
        # Vorlage enthält nur einen Platzhalter — für Typprüfung/Jest genügt das.
        run: cp lib/config.secrets.example.ts lib/config.secrets.ts

      - name: Typprüfung
        run: bun run typecheck

      - name: Lint (eslint)
        run: bun run lint

      - name: Tests (jest)
        run: bun run test

  # ────────────────────────────────────────────────────────────────────────
  # JEDE Coolify-App dieses Repos wird hier so gebaut/validiert, wie Coolify es
  # tut — gleicher Build-Pack, gleicher Kontext, gleiches Dockerfile bzw.
  # gleiche Compose-Datei. Bisher deployte Coolify Dockerfiles und Compose-
  # Stacks, die in der CI nie angefasst wurden: ein defektes COPY, ein fehlendes
  # public/, ein Compose-Syntaxfehler fiel erst in der Umgebung auf.
  #
  # Die Matrix ist die 1:1-Abbildung der Coolify-Resources (Stand: 12 Apps).
  # kind=dockerfile → `docker build -f <dockerfile> <context>`
  # kind=compose    → `docker compose config` (+ `build`, wenn build:-Sektion)
  # `projectdir` entspricht Coolifys Base Directory, `context`/`dockerfile`
  # seinem Dockerfile Location. Weicht hier etwas ab, prüft die CI etwas
  # anderes als deployt wird.
  # Kommt eine Coolify-App hinzu, MUSS sie hier UND in APPS (deploy-Job) rein.
  # ────────────────────────────────────────────────────────────────────────
  images:
    name: Coolify-App (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nextdays-web
            kind: dockerfile
            context: .
            dockerfile: web/Dockerfile
          - app: nextdays-marketing
            kind: dockerfile
            context: marketing
            dockerfile: marketing/Dockerfile
          - app: nextdays-plattform
            kind: dockerfile
            context: .
            dockerfile: plattform/Dockerfile
          - app: nextdays-gastgeber
            kind: dockerfile
            context: .
            dockerfile: gastgeber/Dockerfile
          - app: nextdays-admin
            kind: dockerfile
            context: .
            dockerfile: admin/Dockerfile
          - app: nextdays-storybook
            kind: dockerfile
            context: storybook
            dockerfile: storybook/Dockerfile
          - app: nextdays-api
            kind: compose
            projectdir: .
            compose: deploy/api-standalone/docker-compose.yml
          - app: nextdays-worker
            kind: compose
            projectdir: .
            compose: deploy/worker/docker-compose.yml
          - app: nextdays-docs
            kind: compose
            projectdir: .
            compose: deploy/docs/docker-compose.yml
          - app: nextdays-kong
            kind: compose
            projectdir: deploy/kong
            compose: deploy/kong/docker-compose.yml
          - app: nextdays-redis
            kind: compose
            projectdir: .
            compose: deploy/redis-standalone/docker-compose.yml
          - app: nextdays-supabase
            kind: compose
            projectdir: .
            compose: deploy/supabase/docker-compose.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image bauen (Dockerfile)
        if: matrix.kind == 'dockerfile'
        # Ohne NEXT_PUBLIC_*-Build-Args: die Apps lesen API-/Supabase-URLs erst
        # zur Laufzeit. Bricht der Build ohne sie, ist das ein echter Befund
        # (Wurzel 4) — keine Platzhalter-URL nachschieben, die ihn kaschiert.
        run: docker build -f "${{ matrix.dockerfile }}" -t "ci/${{ matrix.app }}" "${{ matrix.context }}"

      - name: Compose validieren
        if: matrix.kind == 'compose'
        # --project-directory = Coolifys Base Directory: davon hängen die
        # relativen build.context-Pfade ab. Env-Variablen fehlen bewusst
        # (Coolify injiziert sie) — leere Interpolation ist eine Warnung, kein
        # Fehler, und `config` prüft genau, was hier prüfbar ist: Syntax,
        # Service-/Netz-/Config-Referenzen, Build-Kontexte.
        run: docker compose --project-directory "${{ matrix.projectdir }}" -f "${{ matrix.compose }}" config -q

      - name: Compose-Images bauen
        if: matrix.kind == 'compose'
        # Nur Stacks mit build:-Sektion bauen tatsächlich etwas (api, worker,
        # docs); die reinen Image-Stacks (kong, redis, supabase) sind hier ein
        # No-Op — `build` ohne baubaren Service ist erfolgreich.
        run: docker compose --project-directory "${{ matrix.projectdir }}" -f "${{ matrix.compose }}" build

  # ────────────────────────────────────────────────────────────────────────
  # Auto-Deploy bei Push auf main — NUR wenn alle Prüf-Jobs grün sind (needs).
  # Coolifys eigener Push-Webhook ist für die Deploy-Key-Apps nicht nutzbar
  # (manuelle Webhook-Route 500, API-Deploy verlangt Bearer-Header, den
  # GitHub-Webhooks nicht setzen können). Dieser Job bildet Coolifys
  # watch_paths-Logik nach: er deployt nur die Apps, deren Pfade im Push
  # tatsächlich geändert wurden.
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    needs: [api, packages, frontends, mobile, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: coolify-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Deploy geänderte Apps
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          # App-Definitionen: "uuid|name|pfad-präfix1 pfad-präfix2 …"
          # Pfad-Präfixe entsprechen den Coolify-watch_paths (ohne /**).
          # WICHTIG: Pfade müssen den echten Coolify-watch_paths der App
          # entsprechen. apps/api/ gehört an nextdays-api + nextdays-worker —
          # NICHT an nextdays-supabase (sonst reißt jeder API-Push den DB-Stack
          # mit → Container-Race/WAL-Korruptionsrisiko). supabase deployt NUR
          # bei deploy/supabase/**.
          APPS=(
            "jt5gdgragv2jzivpx4oiqfir|nextdays-kong|deploy/kong/"
            "y13cm245vlmvq3yv38gdbtat|nextdays-marketing|marketing/"
            "rh4f581hqashrnmiwnxb6pcu|nextdays-plattform|plattform/ packages/"
            "uo0irbk8eno9c9qonngzqwy2|nextdays-gastgeber|gastgeber/ packages/"
            "oznosa2xmefzmfeqidezodm6|nextdays-admin|admin/ packages/"
            "u67kn5pj9cb2gqryt2ezsc8r|nextdays-storybook|storybook/"
            "cdqxi7d0w34sxzr4wr8jy8um|nextdays-supabase|deploy/supabase/"
            "kilcrxob5u434k3vsyf54ble|nextdays-api|apps/api/ deploy/api-standalone/"
            "ly4w6vw4ffxk2987nyg5z5kt|nextdays-worker|apps/api/ deploy/worker/"
            "bln3q0n1l1se2hna8utkuag9|nextdays-web|web/ packages/"
            "zcjrx4czu338zghc58d41yp7|nextdays-docs|deploy/docs/"
            "yih7d7kz4tkkgezqzg1zzjcs|nextdays-redis|deploy/redis-standalone/"
          )

          # Geänderte Dateien dieses Pushes ermitteln (Fallback: alles).
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Kein gültiger before-Commit → alle Apps prüfen (Erst-Push/Force)."
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi
          echo "Geänderte Dateien:"; echo "$CHANGED" | sed 's/^/  /'

          deploy() {
            local uuid="$1" name="$2"
            echo "→ Deploy $name"
            # POST seit Coolify 4.2.0 (GET liefert 405 "endpoint changed to POST").
            # COOLIFY_URL zeigt auf die HTTPS-Route (Port 8000 ist extern
            # geschlossen — nur 127.0.0.1 + Traefik/443, Security-Härtung K2).
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$uuid")
            cat /tmp/resp.json; echo
            [ "$code" = "200" ] || { echo "::error::Deploy $name fehlgeschlagen (HTTP $code)"; exit 1; }
          }

          any=0
          for entry in "${APPS[@]}"; do
            IFS='|' read -r uuid name paths <<< "$entry"
            match=0
            for p in $paths; do
              if echo "$CHANGED" | grep -q "^$p"; then match=1; break; fi
            done
            if [ "$match" = "1" ]; then
              deploy "$uuid" "$name"; any=1
            else
              echo "– $name übersprungen (keine Änderungen in: $paths)"
            fi
          done
          [ "$any" = "1" ] || echo "Keine App betroffen — nichts zu deployen."
