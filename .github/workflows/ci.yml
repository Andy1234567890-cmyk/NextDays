name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: uv installieren
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Abhängigkeiten installieren
        # In ein venv statt `--system`: der Runner-Interpreter unter /usr ist
        # extern verwaltet (PEP 668) und lehnt Installationen ab. Das venv-bin
        # in GITHUB_PATH macht ruff/pylint/pytest in den Folgeschritten sichtbar.
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src

      - name: Lint (pylint 10/10)
        # Hält die saubere 10.00/10 dauerhaft: bricht ab, sobald das Rating
        # unter 10 fällt (neue echte Befunde). Bewusste Ausnahmen sind zentral
        # in pyproject.toml [tool.pylint.*] begründet.
        run: pylint --fail-under=10 src

      - name: Tests (pytest)
        # Platzhalter-Werte, keine echten Secrets: die Tests sprechen kein
        # Supabase an, der Client wird aber beim Import konstruiert und lehnt
        # einen leeren Key ab. Lokal kommen die Werte aus apps/api/.env.
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
        run: pytest -q

  # Alle Coolify-Apps aus deploy.yml, die aus diesem Repo gebaut werden, laufen
  # hier durch die Typprüfung — bisher deployte nur, was niemand geprüft hat.
  # bun-Workspaces (Wurzel-package.json): eine Installation deckt alle ab.
  frontends:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, marketing, plattform, gastgeber, admin, builder, storybook]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Typprüfung
        working-directory: ${{ matrix.app }}
        run: bun run typecheck

  # Mobile hängt nicht am bun-Workspace (React Native, eigenes npm-Lockfile).
  mobile:
    name: Mobile (Typprüfung + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node bereitstellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests (jest)
        run: npm test
