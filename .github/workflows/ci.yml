name: CI

on:
  push:
    branches: [main]
  # Draft-PRs loesen NICHTS aus: an einem Zweig, der noch in Arbeit ist, ist
  # jeder Push ein Zwischenstand, und jeder Lauf darauf verbrannte Runner-Zeit
  # (belegt: die Laeufe 633-636 an einem Nachmittag, alle auf demselben Draft).
  # `ready_for_review` holt die Pruefung nach, sobald der PR wirklich steht.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Der Deploy-Job hängt an den Prüf-Jobs (needs) — deshalb liegt er in DIESEM
# Workflow und nicht mehr in einer eigenen deploy.yml. Als getrennter Workflow
# lief er unabhängig weiter und schickte auch bei rotem CI jeden main-Push an
# Coolify (belegt: zwei Deploys am 30.07. mit failing CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests)
    needs: [betroffen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.api }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: uv installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        # In ein venv statt `--system`: der Runner-Interpreter unter /usr ist
        # extern verwaltet (PEP 668) und lehnt Installationen ab. Das venv-bin
        # in GITHUB_PATH macht ruff/pylint/pytest in den Folgeschritten sichtbar.
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        if: steps.pruefen.outputs.laufen == 'true'
        run: ruff check src

      - name: Lint (pylint 10/10)
        if: steps.pruefen.outputs.laufen == 'true'
        # Hält die saubere 10.00/10 dauerhaft: bricht ab, sobald das Rating
        # unter 10 fällt (neue echte Befunde). Bewusste Ausnahmen sind zentral
        # in pyproject.toml [tool.pylint.*] begründet.
        run: pylint --fail-under=10 src

      - name: Tests (pytest)
        if: steps.pruefen.outputs.laufen == 'true'
        # Platzhalter-Werte, keine echten Secrets: die Tests sprechen kein
        # Supabase an, der Client wird aber beim Import konstruiert und lehnt
        # einen leeren Key ab. SUPABASE_PUBLIC_URL muss ebenfalls gesetzt sein:
        # `storage_public_base` schlägt bewusst fehl statt zurückzufallen, sonst
        # landete eine interne Kong-Adresse dauerhaft in gespeicherten URLs.
        # Lokal kommen die Werte aus apps/api/.env.
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_PUBLIC_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
          # Zwei Tests pruefen ihre eigene Aussagekraft und brauchen dafuer
          # gesetzte Werte. Lokal kommen sie aus apps/api/.env — deshalb war der
          # Lauf hier gruen und im CI rot:
          #
          # * CHANNEX_WEBHOOK_SECRET: `test_secret_ist_gesetzt_damit_der_401_test
          #   _aussagt` sichert den 401-Test ab. Ohne Secret kaeme der 401 aus
          #   einem Vergleich zweier leerer Strings, und die Pruefung wuere
          #   wertlos — der Test schlaegt deshalb absichtlich Alarm.
          CHANNEX_WEBHOOK_SECRET: ci-placeholder-webhook-secret
          # * RATE_LIMIT_FAIL_CLOSED_SENSITIVE: ohne Redis (im CI laeuft keiner)
          #   antwortet das Ratelimit auf sensiblen Pfaden fail-CLOSED mit 503.
          #   `/mcp/token` ist so ein Pfad, und der Test erwartet die fachliche
          #   Antwort 400 (unsupported_grant_type). Hier ausgeschaltet, damit
          #   geprueft wird, was der Test pruefen will — die Grant-Validierung,
          #   nicht die Redis-Verfuegbarkeit. Das fail-closed-Verhalten selbst
          #   bleibt in Produktion an (Default True) und hat eigene Tests.
          RATE_LIMIT_FAIL_CLOSED_SENSITIVE: "false"
        run: pytest -q

  # Geteilte Pakete (packages/@nextdays/*): die Frontends prüfen nur, was sie
  # importieren — ungenutzter geteilter Code bliebe sonst ungeprüft.
  # ────────────────────────────────────────────────────────────────────────
  # Die ÖFFENTLICHE Partner-API (apps/public-api) — eigener Dienst, eigener Job.
  #
  # Bewusst nicht in den api-Job gehängt: es sind zwei Projekte mit eigenen
  # Abhängigkeiten (dieser hier hat kein Stripe, kein Twilio, kein Firebase).
  # Ein gemeinsamer Job würde beide Abhängigkeitsbäume installieren und die
  # Trennung, die der ganze Sinn des zweiten Dienstes ist, im CI wieder
  # aufheben.
  #
  # Die Tests laufen OHNE Datenbank gegen eine In-Memory-Nachbildung; deshalb
  # braucht dieser Job keine Platzhalter-Secrets für Supabase — nur das
  # Signier-Secret, das die Auth-Tests selbst setzen.
  # ────────────────────────────────────────────────────────────────────────
  public-api:
    name: Öffentliche API (lint + tests)
    needs: [betroffen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/public-api
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.public-api }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: Schwesterdateien byte-identisch
        if: steps.pruefen.outputs.laufen == 'true'
        # Elf Dateien liegen bewusst doppelt (apps/api ↔ apps/public-api).
        # Drift ist hier kein Stilproblem: eine geflickte SSRF-Prüfung in nur
        # einem Baum, zwei verschiedene Verfügbarkeitszahlen, ein Scope, den das
        # Dashboard vergibt und kein Endpunkt kennt. Der Schritt läuft VOR der
        # Installation — er braucht nur den Checkout und soll als Erstes
        # scheitern.
        working-directory: .
        run: bash scripts/ci/public-api-kopien-pruefen.sh

      - name: uv installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        if: steps.pruefen.outputs.laufen == 'true'
        run: ruff check src

      - name: Lint (pylint 10/10)
        if: steps.pruefen.outputs.laufen == 'true'
        run: pylint --fail-under=10 src

      - name: Tests (pytest)
        if: steps.pruefen.outputs.laufen == 'true'
        env:
          # Die Auth-Tests setzen das Secret selbst; hier steht es, damit ein
          # Test, der es NICHT setzt, nicht versehentlich gegen einen leeren
          # Wert läuft und fail-closed grün aussieht.
          API_TOKEN_SECRET: ci-placeholder-signier-secret-0123456789
        run: pytest -q

      - name: OpenAPI-Datei entsteht und ist 3.1
        if: steps.pruefen.outputs.laufen == 'true'
        # Ein Schema, das sich nicht erzeugen lässt, ist ein kaputtes Produkt:
        # `/openapi.json` IST die veröffentlichte Referenz, aus der Kunden ihre
        # Clients generieren. Der Aufruf prüft zusätzlich, dass jeder Endpunkt
        # unter /v1 hängt — ein Pfad ohne Version wäre eine Zusage, die wir
        # nicht halten können.
        env:
          API_TOKEN_SECRET: ci-placeholder-signier-secret-0123456789
        run: |
          python - <<'PY'
          from src.main import app
          spec = app.openapi()
          assert spec["openapi"].startswith("3.1"), spec["openapi"]
          pfade = list(spec["paths"])
          assert pfade, "keine Pfade im Schema"
          ohne_version = [p for p in pfade if not p.startswith("/v1/")]
          assert not ohne_version, f"Pfade ohne /v1: {ohne_version}"
          print(f"OpenAPI {spec['openapi']} — {len(pfade)} Pfade, alle unter /v1")
          PY

      - name: Eingecheckte OpenAPI-Datei ist aktuell
        if: steps.pruefen.outputs.laufen == 'true'
        # `marketing/content/api/openapi.json` ist die Quelle der
        # Entwickler-Referenz auf der Website. Sie wird aus dem Code erzeugt;
        # driftet sie, zeigt die veröffentlichte Doku Endpunkte, die es nicht
        # mehr gibt, oder verschweigt neue. Der Vergleich läuft gegen einen
        # frischen Export — schlägt er fehl, ist der Export nachzuholen
        # (`python scripts/api/openapi-export.py`).
        working-directory: .
        env:
          API_TOKEN_SECRET: ci-placeholder-signier-secret-0123456789
        run: uv run --project apps/public-api python scripts/api/openapi-export.py --pruefen

      - name: Deploy-Stack ist gültig
        if: steps.pruefen.outputs.laufen == 'true'
        # Prüft die Compose-Datei so, wie Coolify sie liest (Variablen dürfen
        # leer sein — geprüft wird die Syntax und die Netz-/Service-Struktur).
        # Ohne diesen Schritt fällt ein Tippfehler erst beim Deploy auf.
        working-directory: .
        run: docker compose -f deploy/public-api/docker-compose.yml config --quiet

  # ────────────────────────────────────────────────────────────────────────
  # Die simulierte Steuerbehörde (apps/dac7-staging) — eigener Dienst, eigener
  # Job.
  #
  # Bewusst NICHT an den api-Job gehängt, und das ist hier mehr als Hygiene:
  # Der Dienst prüft die DAC7-Datei, die apps/api erzeugt, und darf deshalb
  # nichts von ihr importieren. Ein gemeinsamer Job würde beide
  # Abhängigkeitsbäume installieren und genau die Trennung aufheben, die der
  # ganze Sinn dieses Dienstes ist.
  #
  # Die Tests brauchen weder Datenbank noch Netz: Die Empfangsstelle kennt
  # unsere Tabellen nicht, sie sieht nur die Bytes einer eingereichten Datei.
  # ────────────────────────────────────────────────────────────────────────
  dac7-staging:
    name: DAC7-Teststufe (lint + tests)
    needs: [betroffen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dac7-staging
    steps:
      # Kein Job-`if:` — siehe Begründung beim public-api-Job: ein per Job-`if`
      # übersprungener needs-Job gilt GitHub als NICHT erfolgreich und zieht
      # `deploy` mit ins Überspringen.
      - name: Betroffen?
        id: pruefen
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.dac7-staging }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: Kein Import aus apps/api
        if: steps.pruefen.outputs.laufen == 'true'
        working-directory: .
        # DIE Kernregel dieses Dienstes, deshalb im CI und nicht nur in der
        # Doku: Würde die Empfangsstelle die Prüfregeln aus apps/api
        # importieren, prüfte unsere Datei gegen genau die Vorstellung, aus der
        # sie entstanden ist — ein Denkfehler in der Erzeugung wäre dann auch
        # einer in der Prüfung und bliebe unsichtbar. Genau dieser Kurzschluss
        # ist bei der Channex-Facility-Map passiert (Test verglich die Map mit
        # sich selbst, grün, während bei allen Portalen die Ausstattung fehlte).
        run: |
          if grep -rn "from src.features\|import src.features\|apps.api\|apps/api" \
               apps/dac7-staging/src --include='*.py'; then
            echo "::error::apps/dac7-staging importiert aus apps/api — das hebt die Unabhängigkeit der Prüfung auf."
            exit 1
          fi
          echo "Keine Importe aus apps/api — die zweite Lesung bleibt unabhängig."

      - name: uv installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        if: steps.pruefen.outputs.laufen == 'true'
        run: ruff check src

      - name: Lint (pylint 10/10)
        if: steps.pruefen.outputs.laufen == 'true'
        run: pylint --fail-under=10 src/core src/v1 src/main.py

      - name: Tests (pytest)
        if: steps.pruefen.outputs.laufen == 'true'
        env:
          # Der Dienst fährt ohne Token nicht hoch (fail-closed). Hier steht
          # ein Platzhalter, damit die App im Test überhaupt entsteht — die
          # Auth-Tests prüfen mit genau diesem Wert, dass 401 kommt, wenn er
          # fehlt oder falsch ist.
          STAGING_TOKEN: ci-platzhalter-token-nicht-echt
        run: pytest -q

      - name: Ohne Token fährt der Dienst nicht hoch
        if: steps.pruefen.outputs.laufen == 'true'
        # Die Gegenprobe zur fail-closed-Zusage. Ohne sie wäre nicht belegt,
        # dass ein vergessenes Secret auffällt — eine offene Empfangsstelle
        # für Dateien mit CPR-Nummern fiele sonst niemandem auf.
        run: |
          if STAGING_TOKEN= python -c "from src.main import create_app; create_app()" 2>/dev/null; then
            echo "::error::Der Dienst startet ohne STAGING_TOKEN — fail-closed ist gebrochen."
            exit 1
          fi
          echo "Ohne STAGING_TOKEN kein Start — wie vorgesehen."

      - name: Deploy-Stack ist gültig
        if: steps.pruefen.outputs.laufen == 'true'
        working-directory: .
        env:
          STAGING_TOKEN: ci-platzhalter-token-nicht-echt
        run: docker compose -f deploy/dac7-staging/docker-compose.yml config --quiet

  packages:
    name: Packages (Typprüfung + Lint)
    needs: [betroffen]
    runs-on: ubuntu-latest
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.packages }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: bun installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun install --frozen-lockfile

      - name: Typprüfung
        if: steps.pruefen.outputs.laufen == 'true'
        run: bunx tsc -p packages

      - name: Lint (eslint)
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun run lint:packages

  # ---------------------------------------------------------------------------
  # Sicherheitsgate: kein Geheimnis im auslieferbaren Frontend.
  #
  # BEWUSST OHNE `betroffen`-Filter und ohne `if:` an den Schritten — anders als
  # jeder andere Job hier. Begruendung: die anderen Jobs pruefen die QUALITAET
  # einer App, dieses Gate prueft den ZUSTAND DES REPOS. Ein Geheimnis kann
  # ueber eine Datei hereinkommen, die keiner App zugerechnet wird (eine
  # .gitignore, die eine Regel verliert, war genau der Fall am 31.08.2026), und
  # ein uebersprungenes Sicherheitsgate ist kein Gate. Es laeuft in ~2 s, der
  # Preis ist also der Runner-Start.
  #
  # Was es findet, steht im Kopf des Skripts. Kurz: NEXT_PUBLIC_-Variablen mit
  # Geheimnis-Namen (Next.js inlined die in das Browser-Bundle), literale
  # Schluessel, JWTs mit role=service_role (die umgehen RLS, Wurzel 6) und
  # versionierte Geheimnis-Dateien.
  frontend-geheimnisse:
    name: Sicherheit (keine Geheimnisse im Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Kein bun, kein `bun install`: das Skript nutzt ausschliesslich die
      # Node-Standardbibliothek und `git ls-files`. Eine Sicherheitspruefung mit
      # Abhaengigkeiten waere selbst eine Angriffsflaeche (Supply-Chain), und
      # ohne Installation kann sie nicht daran scheitern.
      - name: Geheimnisse im Frontend?
        run: node scripts/security/frontend-geheimnisse-pruefen.mjs

  # ---------------------------------------------------------------------------
  # Komplexitaets-Gate: keine NEUE Verwicklung.
  #
  # Ebenfalls ohne `betroffen`-Filter, aus demselben Grund wie oben: geprueft
  # wird der ZUSTAND DES REPOS. Komplexitaet waechst quer ueber App-Grenzen,
  # und ein uebersprungenes Ratchet ist kein Ratchet.
  #
  # HINTERGRUND (Messung 10.09.2026): die ruff-Auswahl in apps/api enthielt
  # kein `C90` und kein `PLR` — die Komplexitaetsregeln waren nie scharf
  # geschaltet, und so wuchsen 536 Verstoesse unbemerkt, darunter eine Funktion
  # mit 797 Zeilen und eine React-Komponente mit 39 useState. Der Altbestand
  # ist eingefroren (Baselines), es bricht ausschliesslich NEUES.
  #
  # Kein bun-Install noetig fuer den Backend-Teil (ruff + Python-Stdlib); der
  # Frontend-Teil braucht die App-Abhaengigkeiten fuer ESLint.
  spaghetti:
    name: Qualitaet (keine neue Komplexitaet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: uv installieren
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Frontend-Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      # ruff aus apps/api/pyproject.toml statt per fester Version: die Baseline
      # ist gegen GENAU diese ruff-Version gemessen. Eine hier hartkodierte
      # Nummer liefe irgendwann auseinander, und eine neue ruff-Fassung mit
      # anderer Zaehlweise liesse das Gate grundlos brechen (oder schweigen).
      - name: ruff bereitstellen
        working-directory: apps/api
        run: |
          uv venv --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Neue Komplexität?
        run: bash scripts/qualitaet/spaghetti-gate.sh

  # Falsche DB-Spalten: fuer Python eine Zeichenkette, fuer ruff und pylint
  # unsichtbar, und die Fake-DB der Tests nimmt JEDE erfundene Spalte an.
  # Sichtbar wird der Fehler erst beim echten Aufruf — als roher 500 beim
  # Kunden. Live am 10.09.2026 achtmal gefunden, u. a. in der
  # Verdienstrechnung und im Gebuehrenlauf.
  #
  # Das Skript nimmt das Schema per PostgREST (`/rest/v1/`, service_role) —
  # NICHT per SSH: der SSH-Weg braucht root auf der Produktionsmaschine, und
  # dieser Schluessel gehoert nicht in einen Runner. Beide Wege liefern
  # nachweislich dasselbe (4937 zu 4937 Angaben, gemessen).
  db-spalten:
    name: DB-Spalten gegen das Live-Schema
    needs: [betroffen]
    runs-on: ubuntu-latest
    steps:
      - name: Betroffen?
        id: pruefen
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.db-spalten }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      # Ohne Zugangsdaten faellt das Skript auf SSH zurueck und stirbt im
      # Runner an einem fehlenden Schluessel — eine unverstaendliche
      # Fehlermeldung fuer ein fehlendes Secret. Deshalb hier die klare
      # Ansage, und der Job endet ROT: ein uebersprungenes Gate, das gruen
      # meldet, ist schlimmer als keins.
      - name: Zugangsdaten vorhanden?
        if: steps.pruefen.outputs.laufen == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL und SUPABASE_SERVICE_ROLE_KEY fehlen als Repository-Secret. Ohne sie kann dieser Job das Live-Schema nicht lesen."
            exit 1
          fi

      # Das Skript bricht selbst ab, wenn die Spec beschnitten ist (< 300
      # Tabellen) — ein anon-Key im Secret wuerde sonst nur 9175 statt 14238
      # Angaben pruefen und trotzdem gruen melden.
      - name: Jede Spalte existiert wirklich
        if: steps.pruefen.outputs.laufen == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/diagnose/db-spalten-pruefen.py

  # Statische Fallen, die kein anderes Gate sieht. Alle drei Pruefungen gab es
  # laengst — sie liefen nur nie automatisch, und genau deshalb sind ihre
  # Fehlerklassen wiederholt durchgerutscht (zuletzt ein typografisches
  # Anfuehrungszeichen am 10.09.2026, gefunden vom Nutzer statt vom Gate).
  # Reine Quelltextpruefungen: kein Netz, keine DB, keine Secrets.
  statische-fallen:
    name: Statische Fallen (Quotes, use server, Kacheln)
    needs: [betroffen]
    runs-on: ubuntu-latest
    steps:
      # Kein Job-`if:` — gleiche Ueberlegung wie bei kanal-enums: ein per
      # Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich.
      - name: Betroffen?
        id: pruefen
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.statische-fallen }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      # Ein typografisches Anfuehrungszeichen im String-Literal ist fuer den
      # Menschen unsichtbar und fuer den Parser ein Fehler. Betrifft NUR
      # Python — in TS/TSX faengt es der Compiler.
      - name: Keine typografischen Quotes in Python-Strings
        if: steps.pruefen.outputs.laufen == 'true'
        run: python3 scripts/diagnose/typografische-quotes-pruefen.py

      # Ein `export const` in einer "use server"-Datei bricht erst in
      # „Collecting page data" — nach tsc, nach ESLint, mitten im Deploy.
      - name: 'Dateien mit use-server-Direktive exportieren nur async functions'
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/diagnose/use-server-exporte-pruefen.mjs

      - name: Kachel-Katalog deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/diagnose/dashboard-kacheln-pruefen.mjs

  # Typprüfung je Frontend — schnelles, präzises Signal VOR den langsamen
  # Image-Builds. Der Produktions-Build läuft für die deployten Apps im
  # images-Job (dort exakt wie Coolify baut), nicht doppelt hier.
  # bun-Workspaces (Wurzel-package.json): eine Installation deckt alle ab.
  frontends:
    name: Frontend-Typprüfung (${{ matrix.app }})
    needs: [betroffen]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, marketing, plattform, gastgeber, admin, partner, builder, storybook]
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Der Bereichsname IST der Matrix-Wert (bereiche.txt fuehrt jede App
        # unter ihrem eigenen Namen). Einen Ausdruck
        # `needs.betroffen.outputs[matrix.app]` gibt es in GitHub-Expressions
        # nicht — deshalb das ganze outputs-Objekt als JSON und der Zugriff per
        # jq.
        #
        # Fehlt der Eintrag, wird NICHT uebersprungen, sondern abgebrochen
        # (fail-closed, Wurzel 5): ein leerer Wert sieht aus wie "nicht
        # betroffen", und die App bliebe bei gruenem Lauf dauerhaft ungeprueft.
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        env:
          BEREICHE: ${{ toJSON(needs.betroffen.outputs) }}
        run: |
          set -euo pipefail
          wert=$(printf '%s' "$BEREICHE" \
            | jq -r --arg a "${{ matrix.app }}" '.[$a] // empty')
          if [ -z "$wert" ]; then
            echo "::error::Kein Bereichs-Output fuer ${{ matrix.app }} — scripts/ci/bereiche.txt und die outputs-Deklaration des Jobs betroffen pruefen."
            exit 1
          fi
          echo "laufen=$wert" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: bun installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun install --frozen-lockfile

      - name: Typprüfung
        if: steps.pruefen.outputs.laufen == 'true'
        working-directory: ${{ matrix.app }}
        run: bun run typecheck

      - name: Lint (eslint)
        if: steps.pruefen.outputs.laufen == 'true'
        # Fängt, was `tsc` NICHT sieht: toter Code, Hooks hinter einem frühen
        # Return, vergessene Hook-Abhängigkeiten, verschluckte Fehler ohne
        # `cause`. Regeln zentral in packages/eslint-config; Warnungen brechen
        # nicht ab (`--max-warnings` bewusst offen, solange der Bestand noch
        # `any`s und <img> trägt), Fehler schon.
        working-directory: ${{ matrix.app }}
        run: bun run lint

      - name: Produktions-Build
        # Nur builder — und seit dem 24.08.2026 aus einem anderen Grund als
        # vorher: die App HAT jetzt eine Coolify-Resource und baut im images-Job
        # über ihr Dockerfile. Dieser Schritt bleibt trotzdem, weil er etwas
        # anderes prüft: den Build im REPO-Kontext (`bun run build` im
        # Workspace), während der images-Job den Docker-Build prüft. Beide
        # können unabhängig kaputtgehen — der Docker-Build etwa dann, wenn ein
        # `COPY` fehlt, obwohl der Next-Build stimmt.
        # Die Betroffenheit steht davor und mit UND: ein nicht betroffener
        # builder-Push soll auch nicht bauen.
        if: steps.pruefen.outputs.laufen == 'true' && matrix.app == 'builder'
        working-directory: ${{ matrix.app }}
        run: bun run build

  # Die Kanal-Enums (ReservationChannel/AvailabilitySource) liegen in jedem
  # Frontend als handgepflegte Kopie des Pydantic-Contracts. `tsc` prüft nur
  # gegen die Kopie und sieht einen neuen Backend-Wert deshalb NIE — die UI
  # kippt erst bei der ersten echten Buchung dieses Kanals (fehlendes Label,
  # Farb-Fallback auf einen fremden Kanal, Filter ohne Treffer). Genau das ist
  # mit `ota_other` passiert.
  kanal-enums:
    name: Kanal-Enums (Backend ↔ Frontends)
    needs: [betroffen]
    runs-on: ubuntu-latest
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.kanal-enums }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: Enums und Labels deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/kanal-enums-pruefen.mjs
      - name: Nebenquellen-Praefixe deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        # Ein Thread ohne Zeile in `channex_booking` kennt die Flag-Endpunkte
        # nicht. Fehlt sein Praefix an einer der drei Stellen, laeuft der
        # Aufruf in einen 404 — und weil die Oberflaeche das Ergebnis
        # verwirft, gilt der Thread fuer IMMER als ungelesen. Genau so fehlte
        # `eig:` (0611) im Frontend, und dort stand ein `wa-neu:`, das es nie
        # gab.
        run: node scripts/i18n/nebenquellen-praefixe-pruefen.mjs
      - name: Rollen-Kette (DB → Pydantic → Unions → Labels)
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/rollen-pruefen.mjs
      - name: Schloss-Anbieter deckungsgleich (Katalog → Schema → Provider → Migration → Preis)
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/schloss-anbieter-pruefen.mjs

      # Drei Intl-Fehlerklassen, die weder `tsc` noch ESLint sehen und erst im
      # Browser als roter Konsolenfehler auftauchen: ein Schlüssel mit "." IN
      # einer Ebene (next-intl verwirft dann die GANZE Sprachdatei), ein `t()`
      # auf einen Schlüssel, den es nicht gibt, und ein `t()` ohne Werte,
      # obwohl der Text Platzhalter erwartet. Anlass 04.09.2026: der Dienstplan
      # warf alle drei gleichzeitig — 426 Punkt-Schlüssel je Sprache aus einem
      # flachen Übersetzungslauf, dazu drei falsche Farbnamen in der
      # Website-Designleiste, die es seit Monaten gab.
      - name: Intl-Laufzeitfehler
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/intl-laufzeitfehler-pruefen.mjs

      # Jeder Platzhalter aus dem Backend-Katalog braucht sein Etikett in allen
      # 24 Sprachen. Die Prüfung darüber vergleicht die Sprachen UNTEREINANDER
      # und übersieht deshalb ein Feld, das in allen 24 fehlt — genau so kamen
      # 31 neue Platzhalter ohne Beschriftung in die Oberfläche.
      - name: Platzhalter-Etiketten vollstaendig
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/pruefe-feld-labels.mjs

      # Der Namespace `entwickler` (Entwickler-Portal /entwickler) muss in ALLEN
      # 24 Sprachen vollständig sein: marketing lädt die Sprachdatei OHNE Merge
      # mit der Basissprache, ein fehlender Schlüssel ist deshalb kein deutscher
      # Text, sondern ein MISSING_MESSAGE — und in einer Server Component bricht
      # damit die ganze Seite. Zusätzlich geprüft: Code-Bezeichner (Feldnamen,
      # Header) sind in keiner Übersetzung verändert worden.
      - name: Entwickler-Portal in allen Sprachen
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/entwickler-namespace-pruefen.mjs

      # Ein Abschnittstyp des Website-Baukastens steht an SIEBEN Stellen (DB-CHECK,
      # Pydantic-Enum, content-Schema, zwei TypeScript-Unions, der Editor-Katalog
      # und das switch im Renderer) plus Label und Hinweis in 24 Sprachen. Keine
      # dieser Stellen prüft die anderen: `tsc` sieht nur die eigene Kopie, und
      # ein Typ, der im Katalog steht, aber im Renderer fehlt, ist ein Abschnitt,
      # den der Kunde anlegen kann und der in der Vorschau leer bleibt — ohne
      # Fehlermeldung. Dieselbe Klasse Fehler wie bei den Kanal-Enums.
      - name: Abschnitts-Typen des Baukastens deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/blocktypen-pruefen.mjs

      # Ein fehlendes Land ist eine Stammdate, die der Kunde nicht eintragen
      # kann — und ein UNGÜLTIGER Code fällt niemandem auf, weil
      # Intl.DisplayNames dann den gespeicherten deutschen Namen zurückgibt:
      # die Auswahl sieht korrekt aus, gespeichert wird ein Kürzel, das kein
      # Portal kennt. Live waren es 193 statt 242 Gebiete (alle abhängigen
      # fehlten) und drei falsche Codes (FX/SU/UK statt FR/RU/GB); gemeldet
      # wurde es vom Nutzer („faroe islands fehlt"), nicht von einem Test.
      - name: Länderliste vollständig und ISO-konform
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/laenderliste-pruefen.mjs

      # Sprache und Länderwissen fest verdrahtet statt durchgereicht — dieselbe
      # Wurzel wie ein hartkodiertes „€", nur bei Datum, Zahl, Sortierung und
      # Beispielwert. Live am 10.09.2026: `gastgeber/lib/laender.ts` hielt
      # `const SPRACHE = "de"` und speiste damit Intl.DisplayNames — alle
      # Ländernamen standen in allen 45 Sprachen auf Deutsch. Vier Formulare
      # trugen fest `placeholder="DE123456789"` neben einer Länderauswahl, die
      # nicht nachzog; ein dänischer Partner tippt danach eine Nummer, die es
      # in DK nicht gibt. Beides sieht im Code plausibel aus und fällt nur dem
      # auf, der die Oberfläche in einer Fremdsprache öffnet.
      - name: Kein fest verdrahtetes Sprach-/Länderwissen
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/laender-formwissen-pruefen.mjs

      # Dieselbe Logik in mehreren Kopien — die Fehlerklasse, die bei der
      # Nachprüfung des Baukastens am 27.08.2026 DREIMAL zuschlug: die
      # Menü-Beschriftung stand zweimal da und nur eine Kopie lernte den
      # Nachschlag (B1), die Einstellungen zeichneten ihre Navigation neben die
      # zentrale (C2), und der Vorschau-Token stand viermal da — nur eine Stelle
      # hatte den `.catch`, die drei anderen hingen bei einem Netzfehler für
      # immer auf „wird vorbereitet" (Wurzel 5). Keine dieser Kopien fällt beim
      # Bearbeiten auf: wer die eine Stelle findet, hört auf zu suchen.
      # Eine Menü-Kennung ohne Symbol trägt in der Oberfläche einen grauen
      # Punkt — der sieht nicht wie ein Fehler aus, sondern wie eine
      # Gestaltungsentscheidung. Genau deshalb wurde dieselbe Lücke DREIMAL in
      # Folge vom Nutzer gemeldet statt vom System: die sieben
      # Theme-Unterpunkte (B1), dann die fünf Katalog-Kategorien, dann
      # „layout" unmittelbar nach deren Behebung.
      - name: Menü-Kennungen des Baukastens haben Symbole
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/diagnose/menue-symbole-pruefen.mjs

      - name: Baukasten ohne doppelte Definitionen
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/diagnose/baukasten-doppel-kopien-pruefen.mjs

      # Zwei Vorlagen-Kataloge (Seiten 0434, Pop-ups 0440) stehen je an drei
      # Stellen: Backend, Auswahlliste im Dialog, Beschriftung in 24 Sprachen.
      # Ein Name, den nur der Dialog kennt, bringt beim Anlegen einen 422;
      # einer, den nur das Backend kennt, ist eine tote Vorlage.
      - name: Vorlagen-Kataloge deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/vorlagen-pruefen.mjs

      # Der Benachrichtigungs-Dispatcher schreibt einen Pfad in `ziel_pfad`;
      # daraus wird der Knopf „In myNextDays ansehen" in der Mail. Ob es diesen
      # Pfad im Dashboard gibt, prüft sonst nichts — und zweimal gab es ihn
      # nicht (`/aufgaben/<id>` am 11.08., `/posteingang/<thread>` am 24.08.).
      # Beide Male war die Mail schon raus, und eine verschickte Mail lässt sich
      # nicht zurückholen.
      - name: Sprungziele der Benachrichtigungen haben eine Route
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/diagnose/melde-ziele-pruefen.mjs

      # Mailtexte sind ein Python-Dict. Eine fehlende Sprache ist kein Syntax-
      # und kein Testfehler — sie wird zur Mail im Fallback, also in einer
      # Sprache, die der Empfänger nicht gewählt hat. Live am 24.08.2026: ein
      # dänischer Betrieb bekam einen deutschen Betreff.
      - name: Mailtexte in allen Sprachen vorhanden
        if: steps.pruefen.outputs.laufen == 'true'
        run: python3 scripts/i18n/mail-texte-pruefen.py

      # Der Scope-Katalog wird von DREI Stellen gelesen: dem Backend (was das
      # Dashboard vergeben darf), der Auswahl in der Oberfläche und den
      # Etiketten in 24 Sprachen. Fehlt ein Bereich in der Oberfläche, kann
      # niemand dieses Recht vergeben — die zugehörigen Endpunkte der
      # öffentlichen API antworten dann dauerhaft mit 403, ohne dass irgendwo
      # ein Fehler auftaucht. Genau dieser Zustand lag vor, als die API um
      # Preise, Gäste, Aufgaben und Webhooks erweitert wurde.
      - name: API-Scopes in Backend und Oberfläche deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/api-scopes-pruefen.mjs

      # Provisionssatz und Monatsdeckel sind Zahlen der ABRECHNUNG. Standen sie
      # zusaetzlich im Fliesstext der 48 Sprachdateien, waere bei einer
      # Satzaenderung im Backend die neue Zahl als Ueberschrift ueber einem
      # Absatz mit der alten gelandet — in 24 Sprachen, unsichtbar fuer tsc,
      # ESLint und jeden Test.
      - name: Provisionssaetze nur aus der API
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/provisionssaetze-pruefen.mjs

      # Die Liste der 24 EU-Amtssprachen liegt an VIER Stellen: Dashboard-
      # Oberflaeche, Backend-Validierung, Adresszeilen-Pruefung des Renderers
      # und die Anzeigenamen im Sprachwaehler. Ein gemeinsames Paket gibt es
      # nicht, weil Python und der Renderer keine Laufzeit teilen — also
      # dasselbe Muster wie bei den Kanal-Enums: bewusste Kopien plus diese
      # Pruefung. Ohne sie wird eine Sprache im Baukasten angeboten, die das
      # Backend mit 422 ablehnt, oder der Sprachwaehler zeigt den nackten Code.
      - name: Sprachlisten deckungsgleich
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/sprachlisten-pruefen.mjs

      # Jede Sprachdatei muss DIESELBEN Schluessel tragen wie die deutsche.
      #
      # Das Skript gab es schon, es lief nur nirgends — und deshalb blieb die
      # Luecke stumm, die es findet: am 26.08.2026 fehlten in JEDER der 23
      # Sprachen 787 Schluessel (ganze Namensraeume wie `objects.objektePage`,
      # `ownerReporting`, `reservations.inboxSidebar`). Sichtbar wurde es erst,
      # als jemand die Oberflaeche auf Daenisch stellte und die Konsole voll
      # MISSING_MESSAGE lief; im Bild stand an diesen Stellen der nackte
      # Schluesselname.
      #
      # `pruefe-locales-vollstaendig.mjs` (oben) faengt das NICHT: es prueft,
      # dass es 24 DATEIEN gibt, nicht was darin steht. Eine Datei mit halbem
      # Inhalt ist fuer es vollstaendig.
      #
      # Geprueft wird zusaetzlich Platzhalter-Treue ({name}, [%MARKE%]) — ein
      # verlorener Platzhalter bricht die Oberflaeche zur Laufzeit.
      - name: Uebersetzungen vollstaendig (web)
        if: steps.pruefen.outputs.laufen == 'true'
        run: node scripts/i18n/pruefe-uebersetzungen.mjs web

  # Die drei Mobile-Apps (ADR-0019/ADR-0022) hängen nicht am Wurzel-Workspace (React
  # Native braucht sein eigenes, nicht gehobenes node_modules — deshalb hat jede
  # App ein eigenes bun.lock), nutzen aber denselben Paketmanager. Matrix statt
  # drei Jobs: der Job-NAME `mobile` bleibt, damit die needs-Kette des
  # deploy-Jobs unverändert gilt.
  mobile:
    name: Mobile (${{ matrix.app }})
    needs: [betroffen]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-bestdays, mobile-nextdays, mobile-owner]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Der Bereichsname IST der Matrix-Wert (bereiche.txt fuehrt jede App
        # unter ihrem eigenen Namen). Einen Ausdruck
        # `needs.betroffen.outputs[matrix.app]` gibt es in GitHub-Expressions
        # nicht — deshalb das ganze outputs-Objekt als JSON und der Zugriff per
        # jq.
        #
        # Fehlt der Eintrag, wird NICHT uebersprungen, sondern abgebrochen
        # (fail-closed, Wurzel 5): ein leerer Wert sieht aus wie "nicht
        # betroffen", und die App bliebe bei gruenem Lauf dauerhaft ungeprueft.
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        env:
          BEREICHE: ${{ toJSON(needs.betroffen.outputs) }}
        run: |
          set -euo pipefail
          wert=$(printf '%s' "$BEREICHE" \
            | jq -r --arg a "${{ matrix.app }}" '.[$a] // empty')
          if [ -z "$wert" ]; then
            echo "::error::Kein Bereichs-Output fuer ${{ matrix.app }} — scripts/ci/bereiche.txt und die outputs-Deklaration des Jobs betroffen pruefen."
            exit 1
          fi
          echo "laufen=$wert" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: bun installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun install --frozen-lockfile

      - name: Platzhalter-Secrets anlegen
        if: steps.pruefen.outputs.laufen == 'true'
        # lib/config.secrets.ts ist gitignoriert (echter anon-Key), wird aber von
        # lib/config.ts importiert. Ohne die Datei bricht tsc mit TS2307 ab. Die
        # Vorlage enthält nur einen Platzhalter — für Typprüfung/Jest genügt das.
        run: cp lib/config.secrets.example.ts lib/config.secrets.ts

      - name: Typprüfung
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun run typecheck

      - name: Lint (eslint)
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun run lint

      - name: Tests (jest)
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun run test

  # Der Android-RELEASE-Build als Prüfung — NUR myNextDays.
  #
  # WARUM ES DEN JOB BRAUCHT: `mobile-release.yml` baut das Release erst beim
  # manuellen Verteilen. Eine ganze Fehlerklasse zeigt sich ausschliesslich dort
  # und nie im Debug-Build oder in `tsc`/Jest: ProGuard entfernt Code, den ein
  # natives Modul per Reflection sucht; `minifyEnabled` bricht an einer fehlenden
  # Keep-Regel; eine neue Abhängigkeit kollidiert erst beim Zusammenbauen
  # (duplicate class); der Hermes-Bundler scheitert an etwas, das Metro im
  # Dev-Modus toleriert. Bisher fiel das erst auf, wenn der Build fuer die Tester
  # schon laufen sollte — also im schlechtesten Moment.
  #
  # UNSIGNIERT und ohne Secrets: `android/app/build.gradle` ist fail-closed
  # gebaut (Zeile 128) — ohne `MYNEXTDAYS_RELEASE_STORE_FILE` entsteht ein
  # unsigniertes Release-APK statt eines heimlich mit dem Debug-Key signierten.
  # Genau das ist hier richtig: geprüft wird, ob der Release-Build DURCHLÄUFT,
  # nicht ob er verteilbar ist. Kein Release-Schlüssel in einem Prüf-Job, der bei
  # jedem Pull Request läuft (auch aus einem Fork).
  #
  # NUR myNextDays (Stand 19.08.2026): mobile-bestdays hat weder Keystore noch
  # Firebase-App, und sein Android-Projekt ist nicht auf einen Release-Build
  # eingerichtet. Ein Lauf hier würde einen Fehler melden, der keiner ist.
  # Bekommt die Schwester-App ihren Release-Weg, gehört sie hier ergänzt.
  mobile-android-release:
    name: Mobile (Android-Release-Build ${{ matrix.app }})
    needs: [betroffen]
    # Dieser Job ist der teuerste im ganzen Workflow (JDK + Android-SDK +
    # Gradle, ~10 Minuten je App). Er soll deshalb wirklich uebersprungen
    # werden — jeder Schritt haengt an der Betroffenheitspruefung, und ohne
    # Aenderung an der App laeuft nur der erste Schritt (~10 s).
    #
    # ZWEI APPS seit dem 09.09.2026 (vorher nur mobile-nextdays). Der Anlass:
    # `mobile-owner` bekam mit dem Eigentuemer-Chat (0611) eine
    # CAMERA-Berechtigung und ein natives Modul (react-native-quick-crypto mit
    # Nitro). Beides kann den Release-Build brechen, ohne dass ein einziger
    # Test rot wird — Jest und tsc sehen die Gradle-Seite nicht. Ohne diesen
    # Job faellt so ein Bruch erst beim VERTEILEN auf, also dann, wenn man
    # ausliefern will.
    #
    # `mobile-bestdays` fehlt hier bewusst: die App hat noch keinen
    # Release-Workflow-Lauf hinter sich und keinen eigenen Bereich; sie kommt
    # dazu, sobald sie ausgeliefert wird (Reihenfolge nach ADR-0022).
    # KEIN Job-`if` mit `matrix`: GitHub wertet Job-Bedingungen aus, BEVOR die
    # Matrix existiert — `matrix.kuerzel` ist dort schlicht unbekannt und der
    # ganze Workflow gilt als ungueltig ("Unrecognized named-value: 'matrix'",
    # Lauf 833). Der erste Schritt entscheidet stattdessen, wie in den
    # uebrigen Jobs dieser Datei; jeder weitere haengt daran.
    runs-on: ubuntu-latest
    strategy:
      # Eine gebrochene App darf die Pruefung der anderen nicht verdecken.
      fail-fast: false
      matrix:
        include:
          - app: mobile-nextdays
            kuerzel: nextdays
          - app: mobile-owner
            kuerzel: owner
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Betroffen?
        if: steps.pruefen.outputs.laufen == 'true'
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht. Ohne diese Zeile stirbt der Schritt mit "No such file or
        # directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        env:
          BEREICHE: ${{ toJSON(needs.betroffen.outputs) }}
        run: |
          set -euo pipefail
          wert=$(printf '%s' "$BEREICHE" \
            | jq -r --arg a "mobile-android-${{ matrix.kuerzel }}" '.[$a] // empty')
          if [ -z "$wert" ]; then
            echo "::error::Kein Bereichs-Output fuer mobile-android-${{ matrix.kuerzel }} — scripts/ci/bereiche.txt und die outputs-Deklaration des Jobs betroffen pruefen."
            exit 1
          fi
          echo "laufen=$wert" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: bun installieren
        if: steps.pruefen.outputs.laufen == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: JDK 17 einrichten
        if: steps.pruefen.outputs.laufen == 'true'
        # Dieselbe Festlegung wie im Verteil-Workflow: AGP 8.x/Gradle verlangt
        # 17, und das Standard-JDK des Runners ist über Generationen nicht
        # stabil. Weicht es hier ab, prüft der Job eine andere Toolchain als die,
        # mit der später verteilt wird — dann ist das Ergebnis wertlos.
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        if: steps.pruefen.outputs.laufen == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Gradle-Cache
        if: steps.pruefen.outputs.laufen == 'true'
        # Ohne Cache dauert der Job mehrere Minuten pro Lauf. Der Schlüssel
        # hängt an den Gradle-Dateien; ändert sich keine, wird derselbe Cache
        # wiederverwendet.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.kuerzel }}-${{ hashFiles(format('{0}/android/**/*.gradle*', matrix.app), format('{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.app)) }}
          restore-keys: gradle-${{ matrix.kuerzel }}-

      - name: Abhängigkeiten installieren
        if: steps.pruefen.outputs.laufen == 'true'
        run: bun install --frozen-lockfile

      - name: Platzhalter-Secrets anlegen
        if: steps.pruefen.outputs.laufen == 'true'
        # Der PLATZHALTER genügt: geprüft wird der Build, nicht die Laufzeit.
        # Der echte anon-Key gehört in den Verteil-Workflow (dort hätte die App
        # bei den Testern sonst kein Realtime) — nicht in einen Job, der auch
        # für Pull Requests aus Forks läuft.
        run: cp lib/config.secrets.example.ts lib/config.secrets.ts
      - name: google-services.json bereitstellen
        if: steps.pruefen.outputs.laufen == 'true'
        # Die Datei ist gitignoriert („pro Arbeitsplatz", siehe
        # android/app/build.gradle) und liegt auf dem Runner nicht vor. Seit Push
        # dazukam, verlangt `apply plugin: "com.google.gms.google-services"` sie
        # ZWINGEND — sonst bricht `:app:processReleaseGoogleServices` ab („File
        # google-services.json is missing"). Genau daran scheiterte dieser Job
        # am 21.08.2026.
        #
        # Die ECHTE Datei aus dem Secret, KEIN Platzhalter: mit erfundenen
        # Kennungen prueft der Job eine Konfiguration, die es nie gibt — ein
        # Fehler, der nur mit den echten Werten auftritt, fiele erst beim
        # Verteilen auf. Derselbe Schritt steht in mobile-release.yml.
        #
        # Der Schritt spricht NICHT mit Google: er dekodiert ein Secret in eine
        # Datei. Kein API-Aufruf, keine Aenderung am Firebase-Projekt.
        #
        # JE APP EIN EIGENES SECRET, und das ist keine Kosmetik: die Datei
        # traegt den PAKETNAMEN (`com.mynextdays` bzw. `com.mynextdays.owner`).
        # Nimmt der Build die falsche, bricht `processReleaseGoogleServices`
        # mit „No matching client found for package name" ab. Der Praefix ist
        # derselbe wie im jeweiligen Verteil-Workflow und in
        # `scripts/mobile/release-kette-pruefen.sh`.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ matrix.kuerzel == 'owner' && secrets.MYNEXTDAYSOWNER_GOOGLE_SERVICES_JSON_BASE64 || secrets.MYNEXTDAYS_GOOGLE_SERVICES_JSON_BASE64 }}
          SECRET_NAME: ${{ matrix.kuerzel == 'owner' && 'MYNEXTDAYSOWNER_GOOGLE_SERVICES_JSON_BASE64' || 'MYNEXTDAYS_GOOGLE_SERVICES_JSON_BASE64' }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Secret $SECRET_NAME fehlt."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          # Zurueckpruefen statt vertrauen: ein abgeschnittenes Secret gaebe
          # sonst erst im Gradle-Lauf einen unverstaendlichen Fehler.
          # Projekt UND Paketname zurueckpruefen: ein gueltiges JSON der
          # FALSCHEN App wuerde sonst erst im Gradle-Lauf auffallen, mit
          # „No matching client found for package name".
          python3 -c "import json; d=json.load(open('android/app/google-services.json')); print('ok, Projekt:', d['project_info']['project_id'], 'Pakete:', [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])])"

      - name: Release bauen (unsigniert)
        if: steps.pruefen.outputs.laufen == 'true'
        working-directory: ${{ matrix.app }}/android
        # Feste Platzhalter-Version: `versionCode`/`versionName` leitet der
        # Verteil-Workflow aus der Lauf-Nummer ab. Hier zählt nur, dass der
        # Build durchläuft; eine erfundene „echte" Version wäre irreführend.
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=1 \
            -PversionName="ci-pruefbuild"

      - name: Ergebnis belegen
        if: steps.pruefen.outputs.laufen == 'true'
        # Ein grüner Gradle-Lauf ist kein Beweis, dass ein APK entstanden ist
        # (eine Variante kann übersprungen werden). Also nachsehen — und
        # ausdrücklich festhalten, dass es UNSIGNIERT ist, damit niemand dieses
        # Artefakt für verteilbar hält.
        working-directory: ${{ matrix.app }}/android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::Release-Build lief durch, aber es gibt kein APK."
            exit 1
          fi
          echo "APK: $apk ($(du -h "$apk" | cut -f1)) — UNSIGNIERT, nur Build-Prüfung."

  # Die beiden Apps teilen Code als bewusste KOPIE statt als Paket (ADR-0019,
  # Stufe 1). Dieser Job ersetzt das Paket: er hält genau die Dateien zusammen,
  # deren Divergenz echten Schaden anrichtet.
  mobile-konsistenz:
    name: Mobile (Konsistenz beider Apps)
    needs: [betroffen]
    runs-on: ubuntu-latest
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.mobile-konsistenz }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: Geteilte Logik identisch
        if: steps.pruefen.outputs.laufen == 'true'
        # Divergenz hier erzeugt falsche Zahlen (currency), tote Realtime-Abos
        # (realtime) oder eine App, die gegen ein anderes Backend spricht
        # (config). UI (kit/patterns/Icon) steht bewusst NICHT auf der Liste:
        # die darf divergieren (ADR-0016, „Mut zur Duplikation").
        run: |
          set -e
          # NOCH NICHT auf der Liste: lib/rechtliches.ts (Impressum, CVR-Nummer,
          # Adressen der Rechtsdokumente). Die Datei existiert bisher nur in
          # mobile-nextdays; sobald myBestDays sie ebenfalls bekommt, gehört sie
          # hierher — hinter beiden Apps steht EIN Anbieter, und eine driftende
          # Anbieterkennzeichnung ist ein Rechtsmangel, kein Schönheitsfehler.
          # components/Splash.tsx ist am 09.09.2026 ZURUECK auf die Liste
          # gekommen. Es stand hier, wurde ausgetragen, als myNextDays seinen
          # animierten Start-Bildschirm bekam ("das ist UI, darf divergieren"),
          # und genau daraus wurde der Fehler: drei Apps derselben Plattform
          # zeigten zwei verschiedene Startbilder mit zwei Laufzeiten (1490 ms
          # Einflug vs. 1320 ms Standbild). Gemeldet vom Nutzer, nicht vom
          # System — "laeuft zu schnell und ist nicht gleichmaessig in allen
          # mobil apps". Eine Startanimation ist das erste, was der Kunde von
          # der Marke sieht; ihre Zeitachse ist damit ein Zustand, kein
          # Geschmack. Was je Marke WIRKLICH verschieden ist (Vektor-Zweiteilung
          # vs. einteiliges PNG), steckt in components/ui/SplashLogo.tsx und
          # steht bewusst NICHT auf dieser Liste.
          # lib/absturzmeldung.ts + components/Fehlergrenze.tsx (28.08.2026):
          # Beide entscheiden, WAS der Kunde bei einem Absturz sieht — im
          # Release eine ruhige Meldung, KEIN Stacktrace. Driftet eine der
          # Apps, zeigt genau sie dem Kunden interne Pfade. Das ist kein
          # UI-Geschmack (ADR-0016), sondern ein Zustand.
          #
          # DREI Apps seit ADR-0022 (mobile-owner). Verglichen wird jede App
          # gegen mobile-bestdays als Referenz — paarweise waere die dritte
          # unbemerkt gedriftet, solange die ersten zwei sich decken.
          #
          # `lib/datei.ts` steht in der ZWEITEN Liste: mobile-owner fuehrt sie
          # bewusst NICHT (die App laedt nichts hoch, also traegt sie auch den
          # Dateiwaehler nicht als natives Modul). Wer sie dort ergaenzt, muss
          # `@react-native-documents/picker` mitliefern — sonst bricht JEDER
          # Test, der die Datei in der Importkette hat.
          set -e
          for f in lib/currency.ts lib/realtime.ts lib/config.ts \
                   lib/config.secrets.example.ts lib/appwechsel.ts \
                   lib/ausstattung.ts lib/absturzmeldung.ts \
                   components/Fehlergrenze.tsx components/Splash.tsx \
                   theme/tokens.ts theme/ThemeProvider.tsx \
                   navigation/tab-style.tsx; do
            for app in mobile-nextdays mobile-owner; do
              diff -u "mobile-bestdays/$f" "$app/$f"
            done
          done
          # Nur in den beiden Apps mit Upload-Pfad.
          for f in lib/datei.ts; do
            diff -u "mobile-bestdays/$f" "mobile-nextdays/$f"
          done
          # Gegenprobe, dass die Ausnahme eine Ausnahme BLEIBT und nicht zur
          # stillen Luecke wird: liegt die Datei doch in mobile-owner, muss sie
          # auch verglichen werden — dann gehoert sie in die erste Liste.
          if [ -f mobile-owner/lib/datei.ts ]; then
            echo "mobile-owner/lib/datei.ts existiert jetzt — in die obere Liste aufnehmen." >&2
            exit 1
          fi

          # PAARWEISE, ohne mobile-bestdays: Der Eigentuemer-Chat (0611) hat
          # zwei Schwesterdateien, die es im Marktplatz NICHT gibt und geben
          # soll — dort schreibt kein Eigentuemer mit seiner Verwaltung. Die
          # Referenzliste oben kann sie deshalb nicht pruefen.
          #
          # Warum sie trotzdem gleich bleiben MUESSEN: `chat-krypto.ts` ist
          # beide Haelften einer Verschluesselung. Driftet eine App, chiffriert
          # sie anders, als die andere dechiffriert — und das zeigt sich nicht
          # als Absturz, sondern als Nachricht, die beim Empfaenger nicht
          # aufgeht. `chat-anzeige.ts` entscheidet, WANN etwas als unlesbar
          # gilt; zwei Fassungen hiessen, dieselbe Nachricht waere in der einen
          # App lesbar und in der anderen nicht.
          for f in lib/chat-krypto.ts lib/chat-anzeige.ts; do
            diff -u "mobile-owner/$f" "mobile-nextdays/$f"
          done

      - name: Chat-Krypto-Kette schluessig
        if: steps.pruefen.outputs.laufen == 'true'
        # Prueft, dass Verschluesseln und Entschluesseln des Eigentuemer-Chats
        # ZUSAMMENPASSEN (0611-0614). Jest kann das nicht: quick-crypto ist ein
        # natives Modul. Genau in dieser Luecke steckten die drei schwersten
        # Fehler — u. a. eine Freigabe, die vollstaendig gebaut war und
        # kryptografisch nie funktionieren konnte.
        run: node scripts/diagnose/chat-krypto-kette-pruefen.mjs

      - name: Ausstattungs-Labels aus web/messages erzeugt
        if: steps.pruefen.outputs.laufen == 'true'
        # `lib/ausstattung.ts` ist GENERIERT. Ohne diesen Schritt fällt eine
        # von Hand editierte oder veraltete Fassung erst dem Gast auf: er sieht
        # rohe Slugs („nd_single_level"), weil das Merkmal im Katalog fehlt
        # (live so passiert, 19.08.2026 in der myBestDays-App).
        run: node scripts/mobile/ausstattung-labels-sync.mjs --pruefen

      - name: Kernversionen identisch
        if: steps.pruefen.outputs.laufen == 'true'
        # Zwei Lockfiles heißt: nichts hält react/react-native/supabase-js
        # automatisch gleich. Drift ist die teuerste Fehlerklasse — ein Bug
        # reproduziert sich dann nur in einer der beiden Apps.
        run: |
          set -e
          # react-native-quick-crypto + nitro-modules + quick-base64 +
          # @craftzdog/react-native-buffer (09.09.2026, 0611): die
          # Verschluesselung des Eigentuemer-Chats. Zwei Fassungen hiessen zwei
          # verschiedene native Krypto-Module bei gleichem JS — und der Fehler
          # zeigte sich als Nachricht, die beim Empfaenger nicht aufgeht.
          #
          # @react-native-documents/picker (28.08.2026): liefert den
          # System-Dateiwaehler fuer Anhaenge. Zwei Fassungen hiessen zwei
          # verschiedene native Module bei gleichem JS — ein Fehler, der sich
          # dann nur in EINER App reproduziert.
          #
          # DREI Apps seit ADR-0022. `mobile-owner` fuehrt bewusst KEINEN
          # Dateiwaehler (kein Upload-Pfad) — ein Paket, das eine App nicht
          # hat, wird dort uebersprungen ("null"), statt den Job zu faellen.
          # Was sie HAT, muss aber dieselbe Fassung sein: zwei Fassungen heissen
          # zwei verschiedene native Module bei gleichem JS, und ein Bug
          # reproduziert sich dann nur in EINER App.
          for p in react react-native @supabase/supabase-js \
                   @react-navigation/native react-native-keychain \
                   @react-native-documents/picker; do
            a=$(jq -r --arg p "$p" '.dependencies[$p]' mobile-bestdays/package.json)
            for app in mobile-nextdays mobile-owner; do
              b=$(jq -r --arg p "$p" '.dependencies[$p]' "$app/package.json")
              [ "$b" = "null" ] && continue
              [ "$a" = "$b" ] || { echo "$p: $a (bestdays) != $b ($app)"; exit 1; }
            done
          done

          # PAARWEISE, ohne mobile-bestdays: Die Krypto-Pakete des
          # Eigentuemer-Chats (0611) gibt es im Marktplatz nicht — dort
          # schreibt kein Eigentuemer mit seiner Verwaltung. Die Schleife oben
          # koennte sie deshalb nur ueberspringen.
          #
          # Gleichstand ist hier besonders wichtig: `chat-krypto.ts` ist eine
          # byte-identische Schwesterdatei, laeuft aber gegen NATIVE Module.
          # Zwei Fassungen von quick-crypto heissen zwei verschiedene
          # Implementierungen bei identischem JS — und der Fehler zeigt sich
          # als Nachricht, die beim Empfaenger nicht aufgeht, nicht als
          # Absturz.
          for p in react-native-quick-crypto react-native-nitro-modules \
                   react-native-quick-base64 @craftzdog/react-native-buffer; do
            a=$(jq -r --arg p "$p" '.dependencies[$p]' mobile-owner/package.json)
            b=$(jq -r --arg p "$p" '.dependencies[$p]' mobile-nextdays/package.json)
            # `if`, nicht `[ … ] && { … }`: Unter `bash -e` ist ein FALSCHER
            # Test als LETZTER Befehl der Schleife ein Fehlschlag und beendet
            # den Schritt — die Pruefung waere also genau dann rot, wenn alles
            # stimmt (Lauf 834). `if` liefert immer 0, wenn die Bedingung nicht
            # greift.
            if [ "$a" != "$b" ]; then
              echo "$p: $a (owner) != $b (nextdays)"
              exit 1
            fi
            if [ "$a" = "null" ]; then
              echo "$p fehlt in beiden Apps — der Chat braucht es."
              exit 1
            fi
          done

  marketing-konsistenz:
    name: Marketing (bewusste Kopien)
    needs: [betroffen]
    runs-on: ubuntu-latest
    steps:
      # Kein Job-`if:` — SO gewollt: dieser Job steht in `deploy.needs`, und ein
      # per Job-`if` uebersprungener needs-Job gilt GitHub als NICHT erfolgreich;
      # `deploy` wird dann mit-uebersprungen (belegt: Lauf 32505375969 — `images`
      # stand auf skipped, `deploy` lief nicht, obwohl seine Bedingung wahr war).
      # Also entscheidet der ERSTE Schritt, und jeder weitere haengt daran: der
      # Job endet als success (leer durchgelaufen) statt skipped. Preis: ~10 s
      # Runner-Start je nicht betroffenem Job — beabsichtigt.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        run: echo "laufen=${{ needs.betroffen.outputs.marketing-konsistenz }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.laufen == 'true'

      - name: Kopien decken sich mit ihrer Quelle
        if: steps.pruefen.outputs.laufen == 'true'
        # marketing baut ISOLIERT (Coolify base_directory /marketing, eigenes
        # bun.lock) und kann deshalb keine @nextdays/*-Packages importieren —
        # ein `workspace:*`-Eintrag lässt dort `bun install --frozen-lockfile`
        # scheitern. Die geteilte Logik liegt darum als Kopie mit
        # SCHWESTERDATEI-Kopf vor, wie bei den zwei Mobile-Apps (ADR-0019).
        # Drift wäre teuer: `tarif.ts` rechnet die Objekt-Staffel — läuft die
        # Kopie auseinander, zeigt die öffentliche Preisseite einen ANDEREN
        # Preis als der Tarifrechner im Konto, und beide Zahlen sehen plausibel
        # aus.
        run: bash scripts/marketing/kopien-pruefen.sh

  # ────────────────────────────────────────────────────────────────────────
  # Welche Coolify-Apps berührt der Push? Ermittelt EINMAL, genutzt von images
  # (welche Builds laufen) und deploy (welche Apps live gehen). Vorher baute
  # images blind alle 12 Apps und deploy hängt per needs daran — ein
  # API-Fix wartete auf einen 8-Minuten-Storybook-Build, der ihn nicht betraf.
  #
  # Die Pfad-Präfixe MÜSSEN mit den APPS-Einträgen im deploy-Job (und damit den
  # Coolify-watch_paths) übereinstimmen: würde hier weniger matchen als dort,
  # deployte Coolify eine App, deren Image in der CI nie gebaut wurde.
  # `pfade-pruefen.sh` erzwingt das.
  # ────────────────────────────────────────────────────────────────────────
  betroffen:
    name: Betroffene Apps ermitteln
    # Das Tor fuer den ganzen Lauf: jeder andere Job haengt per `needs` hieran.
    # Ein Draft-PR laesst es geschlossen — `types:` allein genuegt nicht, weil
    # `synchronize` auch an Draft-PRs feuert.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      apps: ${{ steps.ermitteln.outputs.apps }}
      base: ${{ steps.basis.outputs.base }}
      # Je Prüf-Bereich ein "true"/"false". Regeln in scripts/ci/bereiche.txt,
      # Namen dort und hier deckungsgleich (bereiche-pruefen.sh erzwingt das —
      # ein Tippfehler wäre ein leerer String und würde den Job STILL
      # überspringen, bei grünem Lauf). Die Matrix-Jobs lesen diese Outputs als
      # Ganzes per toJSON + jq und brechen bei fehlendem Eintrag ab; die
      # Jobs mit fest genanntem Bereich haben diesen Schutz NICHT — für sie ist
      # bereiche-pruefen.sh die einzige Absicherung gegen den Tippfehler.
      api: ${{ steps.bereiche.outputs.api }}
      public-api: ${{ steps.bereiche.outputs.public-api }}
      dac7-staging: ${{ steps.bereiche.outputs.dac7-staging }}
      packages: ${{ steps.bereiche.outputs.packages }}
      web: ${{ steps.bereiche.outputs.web }}
      plattform: ${{ steps.bereiche.outputs.plattform }}
      gastgeber: ${{ steps.bereiche.outputs.gastgeber }}
      admin: ${{ steps.bereiche.outputs.admin }}
      partner: ${{ steps.bereiche.outputs.partner }}
      builder: ${{ steps.bereiche.outputs.builder }}
      marketing: ${{ steps.bereiche.outputs.marketing }}
      storybook: ${{ steps.bereiche.outputs.storybook }}
      kanal-enums: ${{ steps.bereiche.outputs.kanal-enums }}
      mobile-bestdays: ${{ steps.bereiche.outputs.mobile-bestdays }}
      mobile-nextdays: ${{ steps.bereiche.outputs.mobile-nextdays }}
      mobile-owner: ${{ steps.bereiche.outputs.mobile-owner }}
      mobile-android-nextdays: ${{ steps.bereiche.outputs.mobile-android-nextdays }}
      mobile-android-owner: ${{ steps.bereiche.outputs.mobile-android-owner }}
      mobile-konsistenz: ${{ steps.bereiche.outputs.mobile-konsistenz }}
      marketing-konsistenz: ${{ steps.bereiche.outputs.marketing-konsistenz }}
      statische-fallen: ${{ steps.bereiche.outputs.statische-fallen }}
      db-spalten: ${{ steps.bereiche.outputs.db-spalten }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Basis des Diffs ermitteln
        id: basis
        # github.event.before wäre falsch: war das CI eines Pushes rot, wird
        # nichts deployt — beim NÄCHSTEN Push liegen dessen Änderungen aber
        # schon vor `before` und fallen für immer aus dem Diff. Genau so gingen
        # 29b7468 (web) und bc2af55 (marketing) nicht live.
        # Basis ist deshalb der head_sha des letzten erfolgreichen Laufs dieses
        # Workflows auf main — der einzige Stand, von dem sicher ist, dass er
        # deployt wurde. Fällt keiner an (Erst-Lauf, Historie beschnitten),
        # bleibt github.event.before als Rückfall.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "push" ]; then
            base=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&event=push&per_page=10" \
              --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .head_sha" \
              | head -1 || true)
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "Basis: letzter erfolgreicher Lauf ($base)"
            else
              base="${{ github.event.before }}"
              echo "Kein verwertbarer Vorlauf → Rückfall auf before ($base)"
            fi
          else
            # Pull Request: gegen den Merge-Basis-Commit des Ziel-Branches.
            base=$(git merge-base "origin/${{ github.base_ref }}" "${{ github.sha }}" || true)
            echo "Basis (PR): $base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: App-Liste deckungsgleich mit images-Matrix
        run: bash scripts/ci/apps-liste-pruefen.sh

      - name: Bereichs-Regeln deckungsgleich mit ci.yml
        run: bash scripts/ci/bereiche-pruefen.sh

      # Prueft die AUSLIEFERUNG, nicht den Code: hat jede Mobile-App einen
      # Release-Workflow, ihre EIGENE Tester-Gruppe, den passenden
      # Keystore-Praefix und einen Signatur-Beweis? Die Pruef-Jobs unten sehen
      # das nicht — eine neue App faellt dort nicht auf, sie ist einfach nie
      # ausgeliefert worden. Genau so stand `mobile-owner` am 03.09.2026 einen
      # Tag lang da: alle Pruefungen gruen, keine Auslieferung moeglich.
      # Laeuft immer (nicht bereichsgesteuert), weil die Kette auch bricht,
      # wenn nur ein Workflow geaendert wird.
      - name: Mobile-Release-Kette vollstaendig
        run: bash scripts/mobile/release-kette-pruefen.sh

      - name: Betroffene Apps ermitteln
        id: ermitteln
        run: bash scripts/ci/betroffene-apps.sh "${{ steps.basis.outputs.base }}" "${{ github.sha }}"

      - name: Betroffene Prüf-Bereiche ermitteln
        id: bereiche
        # DIESELBE Basis wie die App-Ermittlung. Liefe sie gegen eine andere,
        # würden Prüfjobs und Image-Build von verschiedenen Mengen ausgehen —
        # dann kann ein Image gebaut werden, dessen Prüfung nie lief.
        run: bash scripts/ci/betroffene-bereiche.sh "${{ steps.basis.outputs.base }}" "${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────
  # JEDE Coolify-App dieses Repos wird hier so gebaut/validiert, wie Coolify es
  # tut — gleicher Build-Pack, gleicher Kontext, gleiches Dockerfile bzw.
  # gleiche Compose-Datei. Bisher deployte Coolify Dockerfiles und Compose-
  # Stacks, die in der CI nie angefasst wurden: ein defektes COPY, ein fehlendes
  # public/, ein Compose-Syntaxfehler fiel erst in der Umgebung auf.
  #
  # Die Matrix ist die 1:1-Abbildung der Coolify-Resources (Stand: 12 Apps).
  # kind=dockerfile → `docker build -f <dockerfile> <context>`
  # kind=compose    → `docker compose config` (+ `build`, wenn build:-Sektion)
  # `projectdir` entspricht Coolifys Base Directory, `context`/`dockerfile`
  # seinem Dockerfile Location. Weicht hier etwas ab, prüft die CI etwas
  # anderes als deployt wird.
  # Kommt eine Coolify-App hinzu, MUSS sie hier UND in APPS (deploy-Job) rein.
  #
  # Gebaut wird nur, was der Push berührt (needs.betroffen). Eine App, die
  # nicht gebaut wurde, wird auch nicht deployt — beide Jobs lesen dieselbe
  # Liste, deshalb kann kein ungeprüftes Image live gehen.
  # ────────────────────────────────────────────────────────────────────────
  images:
    name: Coolify-App (${{ matrix.app }})
    needs: [betroffen]
    # Bewusst KEIN Job-`if:` mehr. Hier stand
    # `if: needs.betroffen.outputs.apps != ''` — genau das hat am Lauf
    # 32505375969 den Deploy verhindert: bei einem Push, der keine Coolify-App
    # beruehrt, ging `images` auf skipped, und weil GitHub die `needs` VOR der
    # if-Auswertung prueft, wurde `deploy` mit-uebersprungen. Die Bedingung war
    # ohnehin doppelt — der Schritt `Betroffen?` unten entscheidet je
    # Matrix-Eintrag, und ohne Treffer ist der Job in Sekunden leer durch.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nextdays-web
            kind: dockerfile
            context: .
            dockerfile: web/Dockerfile
          # Root-Kontext wie web: builder/package.json fuehrt @nextdays/* als
          # workspace:*, mit builder/ als Kontext gaebe es kein packages/.
          - app: nextdays-builder
            kind: dockerfile
            context: .
            dockerfile: builder/Dockerfile
          - app: nextdays-marketing
            kind: dockerfile
            context: marketing
            dockerfile: marketing/Dockerfile
          - app: nextdays-plattform
            kind: dockerfile
            context: .
            dockerfile: plattform/Dockerfile
          - app: nextdays-gastgeber
            kind: dockerfile
            context: .
            dockerfile: gastgeber/Dockerfile
          - app: nextdays-admin
            kind: dockerfile
            context: .
            dockerfile: admin/Dockerfile
          - app: nextdays-storybook
            kind: dockerfile
            context: storybook
            dockerfile: storybook/Dockerfile
          - app: nextdays-api
            kind: compose
            projectdir: .
            compose: deploy/api-standalone/docker-compose.yml
          - app: nextdays-worker
            kind: compose
            projectdir: .
            compose: deploy/worker/docker-compose.yml
          - app: nextdays-docs
            kind: compose
            projectdir: .
            compose: deploy/docs/docker-compose.yml
          - app: nextdays-kong
            kind: compose
            projectdir: deploy/kong
            compose: deploy/kong/docker-compose.yml
          - app: nextdays-redis
            kind: compose
            projectdir: .
            compose: deploy/redis-standalone/docker-compose.yml
          - app: nextdays-supabase
            kind: compose
            projectdir: .
            compose: deploy/supabase/docker-compose.yml
          # Die oeffentliche Partner-API: eigener Compose-Stack (api + zusteller),
          # eigenes Image. Baut aus apps/public-api, nicht aus apps/api — die
          # beiden Dienste teilen bewusst keine Abhaengigkeiten.
          - app: nextdays-public-api
            kind: compose
            projectdir: .
            compose: deploy/public-api/docker-compose.yml
          # Die simulierte Steuerbehoerde. Laeuft als einzige App dieses Repos
          # auf dem ZWEITEN Server — der Dienst muss vom PMS aus ueber eine
          # echte Netzwerkstrecke erreichbar sein, nicht ueber localhost.
          - app: nextdays-dac7-staging
            kind: compose
            projectdir: .
            compose: deploy/dac7-staging/docker-compose.yml
    steps:
      # Die Matrix bleibt die vollständige, lesbare Abbildung aller 12
      # Coolify-Resources; ob dieser Eintrag WIRKLICH baut, entscheidet die
      # Betroffenheit. GitHub kann eine include-Matrix nicht dynamisch kürzen,
      # ohne sie als JSON zu generieren — dann verlöre man diese Abbildung.
      # Nicht betroffene Einträge sind in Sekunden durch (kein checkout, kein
      # Build) und erscheinen im Lauf als grün-übersprungen.
      - name: Betroffen?
        id: pruefen
        # Vor dem Checkout gibt es das working-directory dieses Jobs noch
        # nicht (defaults.run.working-directory). Ohne diese Zeile stirbt der
        # Schritt mit "No such file or directory", bevor er etwas tut.
        working-directory: ${{ github.workspace }}
        env:
          APPS: ${{ needs.betroffen.outputs.apps }}
        run: |
          set -euo pipefail
          for a in $APPS; do
            if [ "$a" = "${{ matrix.app }}" ]; then
              echo "bauen=ja" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "${{ matrix.app }} nicht betroffen — übersprungen."
          echo "bauen=nein" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pruefen.outputs.bauen == 'ja'

      - name: Image bauen (Dockerfile)
        if: steps.pruefen.outputs.bauen == 'ja' && matrix.kind == 'dockerfile'
        # Ohne NEXT_PUBLIC_*-Build-Args: die Apps lesen API-/Supabase-URLs erst
        # zur Laufzeit. Bricht der Build ohne sie, ist das ein echter Befund
        # (Wurzel 4) — keine Platzhalter-URL nachschieben, die ihn kaschiert.
        #
        # Zwei Versuche: Docker Hub reißt beim Token-Fetch der Basis-Images
        # sporadisch die Verbindung ab ("connection reset by peer" auf
        # auth.docker.io) — ein Infrastrukturfehler, kein Befund am Code. Der
        # zweite Versuch nutzt die Layer des ersten, ein ECHTER Build-Fehler
        # kostet also kaum Zeit und schlägt weiterhin fehl.
        run: |
          set -uo pipefail
          for versuch in 1 2; do
            if docker build -f "${{ matrix.dockerfile }}" -t "ci/${{ matrix.app }}" "${{ matrix.context }}"; then
              exit 0
            fi
            echo "::warning::Build-Versuch $versuch fehlgeschlagen"
            sleep 20
          done
          echo "::error::Build von ${{ matrix.app }} nach 2 Versuchen fehlgeschlagen"
          exit 1

      - name: Compose validieren
        if: steps.pruefen.outputs.bauen == 'ja' && matrix.kind == 'compose'
        # --project-directory = Coolifys Base Directory: davon hängen die
        # relativen build.context-Pfade ab. Env-Variablen fehlen bewusst
        # (Coolify injiziert sie) — leere Interpolation ist eine Warnung, kein
        # Fehler, und `config` prüft genau, was hier prüfbar ist: Syntax,
        # Service-/Netz-/Config-Referenzen, Build-Kontexte.
        run: docker compose --project-directory "${{ matrix.projectdir }}" -f "${{ matrix.compose }}" config -q

      - name: Compose-Images bauen
        if: steps.pruefen.outputs.bauen == 'ja' && matrix.kind == 'compose'
        # Nur Stacks mit build:-Sektion bauen tatsächlich etwas (api, worker,
        # docs); die reinen Image-Stacks (kong, redis, supabase) sind hier ein
        # No-Op — `build` ohne baubaren Service ist erfolgreich.
        run: docker compose --project-directory "${{ matrix.projectdir }}" -f "${{ matrix.compose }}" build

  # ────────────────────────────────────────────────────────────────────────
  # Auto-Deploy bei Push auf main — NUR wenn alle Prüf-Jobs grün sind (needs).
  # Coolifys eigener Push-Webhook ist für die Deploy-Key-Apps nicht nutzbar
  # (manuelle Webhook-Route 500, API-Deploy verlangt Bearer-Header, den
  # GitHub-Webhooks nicht setzen können). Deployt werden genau die Apps, die
  # der betroffen-Job ermittelt hat — dieselbe Liste, die images gebaut hat.
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    needs: [betroffen, api, public-api, dac7-staging, packages, frontends, frontend-geheimnisse, kanal-enums, mobile, mobile-konsistenz, marketing-konsistenz, images]
    # `always()` ist ZWINGEND: ohne es prueft GitHub die `needs` VOR der
    # if-Auswertung und ueberspringt den Job, sobald irgendein needs-Job
    # `skipped` ist — egal wie wahr die Bedingung ist (belegt: Lauf 32505375969,
    # `images` skipped → `deploy` mit-uebersprungen). `always()` schaltet diese
    # Vorpruefung ab; ersetzt wird sie durch `!contains(needs.*.result,
    # 'failure')`, das `skipped` durchlaesst, aber kein rotes Ergebnis.
    # `cancelled` muss mit rein, sonst deployt ein abgebrochener Lauf ungeprueft.
    # `needs.betroffen.result == 'success'` steht EINZELN da, weil dessen Output
    # die Deploy-Liste IST: waere er leer, meldete der Deploy-Schritt "Keine App
    # betroffen" und endete gruen — obwohl eine App haette live gehen muessen.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.betroffen.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: coolify-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy betroffene Apps
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APPS: ${{ needs.betroffen.outputs.apps }}
        run: |
          set -euo pipefail

          if [ -z "${APPS// }" ]; then
            echo "Keine App betroffen — nichts zu deployen."
            exit 0
          fi

          deploy() {
            local uuid="$1" name="$2"
            echo "→ Deploy $name"
            # POST seit Coolify 4.2.0 (GET liefert 405 "endpoint changed to POST").
            # COOLIFY_URL zeigt auf die HTTPS-Route (Port 8000 ist extern
            # geschlossen — nur 127.0.0.1 + Traefik/443, Security-Härtung K2).
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$uuid")
            cat /tmp/resp.json; echo
            [ "$code" = "200" ] || { echo "::error::Deploy $name fehlgeschlagen (HTTP $code)"; exit 1; }
          }

          # UUID je betroffener App aus der geteilten Liste holen. Fehlt sie
          # dort, ist das ein Fehler und kein Überspringen (fail-closed):
          # sonst gilt eine App still als deployt, die nie angefasst wurde.
          for name in $APPS; do
            uuid=$(awk -F'|' -v n="$name" '$2 == n { print $1 }' scripts/ci/coolify-apps.txt)
            [ -n "$uuid" ] || { echo "::error::Keine UUID für $name in scripts/ci/coolify-apps.txt"; exit 1; }
            deploy "$uuid" "$name"
          done
