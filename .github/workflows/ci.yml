name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v5

      - name: Python 3.12 bereitstellen
        run: uv python install 3.12

      - name: Abhängigkeiten installieren
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src

      - name: Lint (pylint 10/10)
        # Hält die saubere 10.00/10 dauerhaft: bricht ab, sobald das Rating
        # unter 10 fällt (neue echte Befunde). Bewusste Ausnahmen sind zentral
        # in pyproject.toml [tool.pylint.*] begründet.
        run: pylint --fail-under=10 src

      - name: Tests (pytest)
        run: pytest -q
