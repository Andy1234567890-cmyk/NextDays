name: Mobile Release myNextDays Eigentümer (Android)

# EIGENE Datei, nicht ein dritter Eintrag in einem gemeinsamen Workflow
# (ADR-0019/0022). Die Trennung gilt auch für die Auslieferung: eigener
# Keystore, eigene Firebase-App, eigene Tester-Gruppe. Ein gemeinsamer Workflow
# mit `inputs.app` hätte genau EINE Verwechslung gebraucht, um die
# Eigentümer-App mit dem PMS-Schlüssel zu signieren oder sie an die falschen
# Tester zu verteilen — beides wäre nicht rückholbar, weil Android die
# App-Identität an den Signaturschlüssel bindet.
#
# Diese App ist die ZWEITE Einreichung (myNextDays läuft) —
# siehe docs/APP-STORE-ANGABEN.md Abschnitt 2.
#
# MIT `on: push` — als einziger der drei Release-Workflows, und mit Grund.
# Hier stand bis zum 16.09.2026 das Gegenteil ("ein Beta-Build ist eine
# Veröffentlichung, keine Prüfung"). Der Satz stimmt, sein Schluss galt aber
# einem Workflow, der NUR baute und verteilte. Dieser hier fährt vorher
# Typprüfung, Jest, `apksigner verify` UND den Paketnamen-Beweis; ein Build,
# der eine dieser Stufen reisst, erreicht keinen Tester. Was `on: push` also
# automatisiert, ist das Auslösen — nicht das Durchwinken.
#
# Drei Riegel bleiben bewusst stehen:
#   * NUR `mobile-owner/**` (und diese Datei) lösen aus. Ein Commit am Backend
#     verteilt keine App.
#   * NUR APK, also nur Firebase App Distribution an `beta-tester-owner`. Der
#     Play Store bleibt `workflow_dispatch` mit `artefakt: aab` — eine
#     Store-Einreichung ist eine andere Groessenordnung als ein Beta-Build.
#   * `concurrency` bricht den laufenden Bau ab, wenn kurz darauf erneut
#     gepusht wird. Ohne das erzeugen drei Commits hintereinander drei
#     45-Minuten-Läufe und drei Einladungsmails für denselben Stand.
on:
  push:
    branches: [main]
    paths:
      - "mobile-owner/**"
      - ".github/workflows/mobile-release-owner.yml"
  workflow_dispatch:
    inputs:
      artefakt:
        description: "APK (Sideload/Firebase) oder AAB (Play Store)"
        required: true
        default: apk
        type: choice
        options: [apk, aab]
      notiz:
        description: "Was Tester wissen sollen (erscheint in der Verteilung)"
        required: false
        type: string

permissions:
  contents: read

# Ein Push macht den vorigen Lauf gegenstandslos: verteilt werden soll der
# NEUESTE Stand, nicht jeder Zwischenstand. `workflow_dispatch` laeuft dabei in
# einer eigenen Gruppe, damit ein Push einen von Hand ausgeloesten Store-Bau
# nicht mittendrin abraeumt.
concurrency:
  group: eigentuemer-release-${{ github.event_name }}
  cancel-in-progress: true

env:
  APP: mobile-owner
  # `inputs` ist bei einem Push leer. Ohne diesen einen Ort stuende
  # `inputs.artefakt == 'apk'` an sechs Stellen und waere bei JEDEM Push falsch
  # — der Lauf baute, verteilte aber nichts und meldete trotzdem Erfolg. Genau
  # die stumme Attrappe, die den Android-Release-Build eine Woche lang
  # stillgelegt hat (9f634db6). Push heisst APK an die Tester; das AAB gibt es
  # nur auf Ansage.
  ARTEFAKT: ${{ inputs.artefakt || 'apk' }}

jobs:
  bauen:
    name: myNextDays Eigentümer · ${{ inputs.artefakt || 'apk' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC-Token für Workload Identity Federation. Die Organisation verbietet
      # Service-Account-KEYS (iam.disableServiceAccountKeyCreation) — der Zugang
      # läuft schlüssellos über ein kurzlebiges Token.
      id-token: write
    defaults:
      run:
        working-directory: mobile-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: JDK 17 einrichten
        # AGP 8.x/Gradle verlangt 17. Der Runner bringt mehrere JDKs mit; ohne
        # diese Festlegung nimmt Gradle das Standard-JDK, und das ist nicht
        # stabil über Runner-Generationen hinweg.
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Die Vorgabe der Action ist `tools platform-tools`. `tools` ist das
          # alte SDK-Tools-Paket und steht in Googles Repository nicht mehr zur
          # Verfuegung: `sdkmanager` meldet `Failed to find package 'tools'` und
          # bricht mit Exit 1 ab — der Schritt stirbt, bevor irgendetwas gebaut
          # wird. Am 16.09.2026 lagen dadurch alle vier Android-Jobs gleichzeitig
          # still, ohne dass sich hier etwas geaendert haette. Gebraucht wird das
          # Paket ohnehin nicht: Plattform und Build-Tools zieht das Android
          # Gradle Plugin selbst, sobald die Lizenzen angenommen sind.
          packages: platform-tools

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Secrets-Datei anlegen
        # lib/config.secrets.ts ist gitignoriert (echter anon-Key), wird aber von
        # lib/config.ts importiert. Anders als im Prüf-Job (dort genügt der
        # Platzhalter) braucht ein RELEASE-Build den ECHTEN Key — sonst hat die
        # App bei den Testern kein Realtime.
        #
        # Dasselbe Secret wie bei den Schwester-Apps, und das ist richtig: der
        # anon-Key gehört zum Supabase-PROJEKT, nicht zur App. Alle drei Apps
        # sprechen dieselbe Datenbank; welche Zeilen jemand sieht, entscheidet
        # RLS anhand seines JWT, nicht der Schlüssel.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secret MOBILE_SUPABASE_ANON_KEY fehlt — ohne echten anon-Key hätte die App kein Realtime."
            exit 1
          fi
          printf 'export const SUPABASE_ANON_KEY =\n  "%s";\n' "$SUPABASE_ANON_KEY" > lib/config.secrets.ts

      - name: google-services.json anlegen
        # Diese App hat das Firebase-SDK (@react-native-firebase/app +
        # messaging), anders als die myBestDays-App. Sie braucht die Datei also im
        # BUILD, nicht nur bei der Verteilung.
        #
        # android/app/build.gradle wendet das Google-Services-Plugin BEDINGT an
        # (die App soll lokal auch ohne Push baubar sein). Genau deshalb muss
        # der Mangel HIER laut auffallen: ohne diesen Schritt liefe der Build
        # durch und verteilte eine App, in der Push tot ist — ein
        # Konfigurationswert, dessen Fehlen still bleibt, ist derselbe Fehler
        # wie ein verschluckter Exception (CLAUDE.md, Wurzel 5).
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MYNEXTDAYSOWNER_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Secret MYNEXTDAYSOWNER_GOOGLE_SERVICES_JSON_BASE64 fehlt. Zuerst die Firebase-App fuer com.mynextdays.owner anlegen (siehe mobile-owner/android/app/GOOGLE-SERVICES-FEHLT.md), dann: base64 -i mobile-owner/android/app/google-services.json | tr -d '\n' | gh secret set MYNEXTDAYSOWNER_GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          # Zurücklesen statt vertrauen: ein abgeschnittenes Secret gäbe sonst
          # erst im Gradle-Lauf einen unverständlichen Fehler. Und der
          # Paketname wird MITGEPRÜFT — eine Datei der PMS-App würde hier
          # sonst durchlaufen und `:app:processReleaseGoogleServices` erst
          # später mit "No matching client found" abbrechen.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("android/app/google-services.json"))
          pakete = [
              c["client_info"]["android_client_info"]["package_name"]
              for c in d.get("client", [])
          ]
          if "com.mynextdays.owner" not in pakete:
              print(
                  "::error::google-services.json kennt com.mynextdays.owner nicht "
                  f"(enthaelt: {pakete}). Das ist die Datei einer ANDEREN App — "
                  "Push waere tot, ohne dass es auffaellt."
              )
              sys.exit(1)
          print("google-services.json ok, Projekt:", d["project_info"]["project_id"])
          PY

      - name: Typprüfung
        # Der Prüf-Job in ci.yml läuft nur auf main/PR. Ein Release kann von
        # jedem Ref gestartet werden — also hier erneut prüfen, statt auf einen
        # fremden Lauf zu vertrauen.
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Keystore entpacken
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYNEXTDAYSOWNER_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret MYNEXTDAYSOWNER_RELEASE_KEYSTORE_BASE64 fehlt. Einmalig erzeugen: scripts/mobile/keystore-erzeugen.sh mobile-owner"
            exit 1
          fi
          # Außerhalb des Arbeitsbaums: ein Keystore im Repo-Ordner könnte in
          # ein Artefakt geraten. RUNNER_TEMP wird nach dem Lauf verworfen.
          ziel="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ziel"
          chmod 600 "$ziel"
          # Beweis, dass der Schlüssel lesbar ist, BEVOR Gradle zehn Minuten
          # läuft und erst am Signierschritt scheitert.
          keytool -list -keystore "$ziel" \
            -storepass "${{ secrets.MYNEXTDAYSOWNER_RELEASE_STORE_PASSWORD }}" >/dev/null
          echo "pfad=$ziel" >> "$GITHUB_OUTPUT"

      - name: Version aus dem Lauf ableiten
        id: version
        # versionCode MUSS bei jedem Upload steigen, sonst lehnt Play ab und App
        # Distribution zeigt Testern kein Update. `github.run_number` ist monoton
        # und braucht keinen Commit im Repo.
        #
        # Eigene Zählung: die Lauf-Nummer gehört zu DIESEM Workflow. Alle drei
        # Apps haben getrennte App-IDs und damit getrennte Versionsreihen.
        run: |
          set -euo pipefail
          basis=$(node -p "require('./package.json').version")
          [ -n "$basis" ] || { echo "::error::version fehlt in package.json"; exit 1; }
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$basis+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Release bauen
        # `working-directory` am SCHRITT ersetzt den Job-Default, es hängt sich
        # nicht daran an: `android` allein zeigte auf <Wurzel>/android und damit
        # ins Leere. Deshalb hier der vollständige Pfad.
        env:
          MYNEXTDAYSOWNER_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.pfad }}
          MYNEXTDAYSOWNER_RELEASE_STORE_PASSWORD: ${{ secrets.MYNEXTDAYSOWNER_RELEASE_STORE_PASSWORD }}
          MYNEXTDAYSOWNER_RELEASE_KEY_ALIAS: ${{ secrets.MYNEXTDAYSOWNER_RELEASE_KEY_ALIAS }}
          MYNEXTDAYSOWNER_RELEASE_KEY_PASSWORD: ${{ secrets.MYNEXTDAYSOWNER_RELEASE_KEY_PASSWORD }}
        working-directory: mobile-owner/android
        run: |
          set -euo pipefail
          aufgabe=$([ "$ARTEFAKT" = "aab" ] && echo bundleRelease || echo assembleRelease)
          ./gradlew "$aufgabe" --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Signatur beweisen
        # Ein gebautes Artefakt ist KEIN Beweis, dass es signiert ist:
        # build.gradle ist fail-closed gebaut und liefert bei fehlendem Keystore
        # ein UNSIGNIERTES Release-APK — das installiert kein Telefon. Also
        # nachsehen, statt annehmen (Wurzel 5).
        working-directory: mobile-owner/android
        run: |
          set -euo pipefail
          if [ "$ARTEFAKT" = "aab" ]; then
            datei=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          else
            datei=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          [ -n "$datei" ] || { echo "::error::Kein Artefakt gebaut"; exit 1; }
          echo "Artefakt: $datei ($(du -h "$datei" | cut -f1))"

          # apksigner liegt in build-tools; AABs prüfen wir mit jarsigner, weil
          # apksigner nur APKs kennt.
          if [ "$ARTEFAKT" = "apk" ]; then
            signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$signer" verify --print-certs "$datei" || {
              echo "::error::Artefakt ist NICHT gueltig signiert — Keystore-Secrets pruefen."; exit 1; }
          else
            jarsigner -verify "$datei" | grep -q 'jar verified' || {
              echo "::error::AAB ist NICHT gueltig signiert."; exit 1; }
          fi

      - name: Paketnamen des Artefakts beweisen
        # Der Schritt, den die Schwester-Workflows nicht haben — und den die
        # dritte App braucht: `com.mynextdays.owner` und `com.mynextdays.app`
        # unterscheiden sich um ein Wort. Ein falsch gebautes Artefakt an die
        # Eigentümer-Tester zu verteilen wäre von außen nicht zu sehen, und die
        # Tester würden die PMS-App installieren.
        if: env.ARTEFAKT == 'apk'
        working-directory: mobile-owner/android
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          paket=$("$aapt" dump packagename "$apk")
          echo "Paketname: $paket"
          if [ "$paket" != "com.mynextdays.owner" ]; then
            echo "::error::Artefakt traegt $paket statt com.mynextdays.owner — nicht verteilen."
            exit 1
          fi

      # ── Verteilung an die Beta-Tester ────────────────────────────────────
      # Nur für APK: das AAB ist für den Play Store, App Distribution verteilt
      # installierbare Artefakte.
      - name: Bei Google anmelden (schlüssellos)
        if: env.ARTEFAKT == 'apk'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: project-460d8aaf-4b7d-4d13-b3a
          workload_identity_provider: projects/683362094842/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-mobile-release@project-460d8aaf-4b7d-4d13-b3a.iam.gserviceaccount.com
          # Datei statt nur Env-Var: firebase-tools authentifiziert über
          # `autoAuth` mit google-auth-library, und die liest Application
          # Default Credentials aus der Datei, auf die
          # GOOGLE_APPLICATION_CREDENTIALS zeigt. Der `--token`-Weg ist in
          # firebase-tools ausdrücklich deprecated.
          create_credentials_file: true
          export_environment_variables: true

      - name: An Beta-Tester verteilen
        if: env.ARTEFAKT == 'apk'
        env:
          NOTIZ: ${{ inputs.notiz }}
          # Die Firebase-App-ID als SECRET, nicht fest im Text: sie entsteht
          # erst beim Anlegen der App in der Konsole. Eine geratene ID wäre
          # schlimmer als keine — `appdistribution:distribute` verteilte dann
          # an eine FREMDE App, und die Schwester-IDs unterscheiden sich nur in
          # den letzten Zeichen.
          FIREBASE_APP_ID: ${{ secrets.MYNEXTDAYSOWNER_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID:-}" ]; then
            echo "::error::Secret MYNEXTDAYSOWNER_FIREBASE_APP_ID fehlt. Die App-ID steht in der Firebase-Konsole bei der Android-App com.mynextdays.owner (Form: 1:683362094842:android:...). Setzen: gh secret set MYNEXTDAYSOWNER_FIREBASE_APP_ID"
            exit 1
          fi
          # Form prüfen, bevor verteilt wird: eine ID aus dem falschen Projekt
          # oder mit Zeilenumbruch bricht sonst mit einer Meldung ab, die nach
          # einem Rechteproblem aussieht.
          case "$FIREBASE_APP_ID" in
            1:683362094842:android:*) ;;
            *)
              echo "::error::MYNEXTDAYSOWNER_FIREBASE_APP_ID hat nicht die Form 1:683362094842:android:… — gehoert die App zum richtigen Projekt?"
              exit 1
              ;;
          esac
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          # Die Notiz landet bei den Testern in der Einladung. Ohne Eingabe den
          # Commit nehmen — ein leeres Feld hilft niemandem, aber eine
          # erfundene Beschreibung wäre schlimmer (Wurzel 4).
          notiz="${NOTIZ:-}"
          if [ -z "$notiz" ]; then
            notiz="Build ${{ github.run_number }} · $(git log -1 --pretty=%s)"
          fi
          # EIGENE Tester-Gruppe: ein Eigentümer ist kein Mitarbeiter des
          # Betriebs. Die Gruppe `beta-tester` gehört der PMS-App; wer sie hier
          # verwendete, schickte die Eigentümer-App an das Verwaltungsteam.
          bunx firebase-tools appdistribution:distribute "$apk" \
            --app "$FIREBASE_APP_ID" \
            --groups beta-tester-owner \
            --release-notes "$notiz" \
            --project project-460d8aaf-4b7d-4d13-b3a

      - name: Artefakt bereitstellen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-owner-${{ steps.version.outputs.name }}-${{ env.ARTEFAKT }}
          path: mobile-owner/android/app/build/outputs/**/*.${{ env.ARTEFAKT }}
          if-no-files-found: error
          # Kurz halten: ein signiertes Release-Artefakt ist kein Archivgut.
          retention-days: 14
