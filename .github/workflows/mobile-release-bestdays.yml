name: Mobile Release myBestDays (Android)

# EIGENE Datei, nicht ein zweiter Eintrag im myNextDays-Workflow (ADR-0019).
# Die Marken-Grenze gilt auch für die Auslieferung: eigener Keystore, eigene
# Firebase-App, eigene Tester-Gruppe, eigenes Store-Konto. Ein gemeinsamer
# Workflow mit `inputs.app` hätte genau EINE Verwechslung gebraucht, um die
# Gast-App mit dem PMS-Schlüssel zu signieren oder sie an die falschen Tester
# zu verteilen — beides wäre nicht rückholbar.
#
# Ebenfalls ohne `on: push`: ein Beta-Build ist eine Veröffentlichung, keine
# Prüfung. Er signiert mit dem echten Release-Schlüssel und landet bei Testern.
on:
  workflow_dispatch:
    inputs:
      artefakt:
        description: "APK (Sideload/Firebase) oder AAB (Play Store)"
        required: true
        default: apk
        type: choice
        options: [apk, aab]
      notiz:
        description: "Was Tester wissen sollen (erscheint in der Verteilung)"
        required: false
        type: string

permissions:
  contents: read

env:
  APP: mobile-bestdays

jobs:
  bauen:
    name: myBestDays · ${{ inputs.artefakt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC-Token für Workload Identity Federation. Die Organisation verbietet
      # Service-Account-KEYS (iam.disableServiceAccountKeyCreation) — der Zugang
      # läuft schlüssellos über ein kurzlebiges Token.
      id-token: write
    defaults:
      run:
        working-directory: mobile-bestdays
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: JDK 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Secrets-Datei anlegen
        # lib/config.secrets.ts ist gitignoriert, wird aber von lib/config.ts
        # importiert. Ein RELEASE-Build braucht den ECHTEN anon-Key, sonst hat
        # die App bei den Testern kein Realtime.
        #
        # Beide Apps sprechen dasselbe Supabase-Projekt, daher dasselbe Secret
        # wie myNextDays. Der anon-Key ist öffentlich (er steckt in jedem
        # ausgelieferten Client); die Trennung der Auth-Welten macht die
        # RLS-Policy, nicht die Geheimhaltung dieses Schlüssels.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secret MOBILE_SUPABASE_ANON_KEY fehlt — ohne echten anon-Key hätte die App kein Realtime."
            exit 1
          fi
          printf 'export const SUPABASE_ANON_KEY =\n  "%s";\n' "$SUPABASE_ANON_KEY" > lib/config.secrets.ts

      - name: Typprüfung
        # Der Prüf-Job in ci.yml läuft nur auf main/PR. Ein Release kann von
        # jedem Ref gestartet werden — also hier erneut prüfen.
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Keystore entpacken
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYBESTDAYS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret MYBESTDAYS_RELEASE_KEYSTORE_BASE64 fehlt. Einmalig erzeugen: scripts/mobile/keystore-erzeugen.sh mobile-bestdays"
            exit 1
          fi
          # Ausserhalb des Arbeitsbaums: ein Keystore im Repo-Ordner könnte in
          # ein Artefakt geraten. RUNNER_TEMP wird nach dem Lauf verworfen.
          ziel="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ziel"
          chmod 600 "$ziel"
          # Beweis, dass der Schlüssel lesbar ist, BEVOR Gradle zehn Minuten
          # läuft und erst am Signierschritt scheitert.
          keytool -list -keystore "$ziel" \
            -storepass "${{ secrets.MYBESTDAYS_RELEASE_STORE_PASSWORD }}" >/dev/null
          echo "pfad=$ziel" >> "$GITHUB_OUTPUT"

      - name: Version aus dem Lauf ableiten
        id: version
        # versionCode MUSS bei jedem Upload steigen, sonst lehnt Play ab und App
        # Distribution zeigt Testern kein Update. `github.run_number` ist monoton
        # und braucht keinen Commit im Repo.
        #
        # Eigene Zählung: die Lauf-Nummer gehört zu DIESEM Workflow, nicht zu
        # dem von myNextDays. Beide Apps haben getrennte App-IDs und damit
        # getrennte Versionsreihen.
        run: |
          set -euo pipefail
          basis=$(node -p "require('./package.json').version")
          [ -n "$basis" ] || { echo "::error::version fehlt in package.json"; exit 1; }
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$basis+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Release bauen
        # `working-directory` am SCHRITT ersetzt den Job-Default, es hängt sich
        # nicht daran an: `android` allein zeigte auf <Wurzel>/android und damit
        # ins Leere. Deshalb hier der vollständige Pfad.
        env:
          MYBESTDAYS_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.pfad }}
          MYBESTDAYS_RELEASE_STORE_PASSWORD: ${{ secrets.MYBESTDAYS_RELEASE_STORE_PASSWORD }}
          MYBESTDAYS_RELEASE_KEY_ALIAS: ${{ secrets.MYBESTDAYS_RELEASE_KEY_ALIAS }}
          MYBESTDAYS_RELEASE_KEY_PASSWORD: ${{ secrets.MYBESTDAYS_RELEASE_KEY_PASSWORD }}
        working-directory: mobile-bestdays/android
        run: |
          set -euo pipefail
          aufgabe=$([ "${{ inputs.artefakt }}" = "aab" ] && echo bundleRelease || echo assembleRelease)
          ./gradlew "$aufgabe" --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Signatur beweisen
        # Ein gebautes Artefakt ist KEIN Beweis, dass es signiert ist:
        # build.gradle ist fail-closed gebaut und liefert bei fehlendem Keystore
        # ein UNSIGNIERTES Release-APK — das installiert kein Telefon. Also
        # nachsehen, statt annehmen (Wurzel 5).
        working-directory: mobile-bestdays/android
        run: |
          set -euo pipefail
          if [ "${{ inputs.artefakt }}" = "aab" ]; then
            datei=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          else
            datei=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          [ -n "$datei" ] || { echo "::error::Kein Artefakt gebaut"; exit 1; }
          echo "Artefakt: $datei ($(du -h "$datei" | cut -f1))"

          if [ "${{ inputs.artefakt }}" = "apk" ]; then
            signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$signer" verify --print-certs "$datei" || {
              echo "::error::Artefakt ist NICHT gueltig signiert — Keystore-Secrets pruefen."; exit 1; }
          else
            jarsigner -verify "$datei" | grep -q 'jar verified' || {
              echo "::error::AAB ist NICHT gueltig signiert."; exit 1; }
          fi

      # ── Verteilung an die Beta-Tester ────────────────────────────────────
      # Nur für APK: das AAB ist für den Play Store, App Distribution verteilt
      # installierbare Artefakte.
      - name: Bei Google anmelden (schluessellos)
        if: inputs.artefakt == 'apk'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          project_id: project-460d8aaf-4b7d-4d13-b3a
          workload_identity_provider: projects/683362094842/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-mobile-release@project-460d8aaf-4b7d-4d13-b3a.iam.gserviceaccount.com
          # Datei statt nur Env-Var: firebase-tools authentifiziert über
          # google-auth-library, die Application Default Credentials aus der
          # Datei liest, auf die GOOGLE_APPLICATION_CREDENTIALS zeigt.
          create_credentials_file: true
          export_environment_variables: true

      - name: An Beta-Tester verteilen
        if: inputs.artefakt == 'apk'
        # EIGENE Firebase-App und EIGENE Gruppe. `beta-tester` ist die
        # myNextDays-Gruppe (Betriebe); die Gast-App gehört an eigene Tester,
        # sonst bekommt das PMS-Team eine Marktplatz-App und umgekehrt.
        env:
          NOTIZ: ${{ inputs.notiz }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          notiz="${NOTIZ:-}"
          if [ -z "$notiz" ]; then
            notiz="Build ${{ github.run_number }} · $(git log -1 --pretty=%s)"
          fi
          bunx firebase-tools appdistribution:distribute "$apk" \
            --app 1:683362094842:android:17381b5cdbd3ed7cbc0343 \
            --groups beta-tester-bestdays \
            --release-notes "$notiz" \
            --project project-460d8aaf-4b7d-4d13-b3a

      - name: Artefakt bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-bestdays-${{ steps.version.outputs.name }}-${{ inputs.artefakt }}
          path: mobile-bestdays/android/app/build/outputs/**/*.${{ inputs.artefakt }}
          if-no-files-found: error
          # Kurz halten: ein signiertes Release-Artefakt ist kein Archivgut.
          retention-days: 14
