name: Mobile Release (Android)

# EIGENER Workflow statt eines Jobs in ci.yml — und ausdrücklich OHNE
# `on: push`. Ein Beta-Build ist eine Veröffentlichung, keine Prüfung: er
# signiert mit dem echten Release-Schlüssel und landet bei Testern. Das
# passiert auf Ansage (workflow_dispatch) oder an einem Tag, nie automatisch
# bei jedem main-Push.
on:
  workflow_dispatch:
    inputs:
      app:
        # NUR myNextDays: fuer mobile-bestdays gibt es (Stand 19.08.2026) weder
        # eigene Keystore-Secrets noch eine Firebase-App. Waere sie hier
        # waehlbar, wuerde ein Lauf sie mit dem myNextDays-Schluessel signieren
        # und an myNextDays-Tester verteilen — beides falsch. Wenn die
        # Schwester-App verteilt werden soll, bekommt sie ihren eigenen
        # Keystore (scripts/mobile/keystore-erzeugen.sh mobile-bestdays), eine
        # eigene Firebase-App und eigene Secrets; dann hier ergaenzen.
        description: "Welche App"
        required: true
        default: mobile-nextdays
        type: choice
        options: [mobile-nextdays]
      artefakt:
        description: "APK (Sideload/Firebase) oder AAB (Play Store)"
        required: true
        default: apk
        type: choice
        options: [apk, aab]
      notiz:
        description: "Was Tester wissen sollen (erscheint in der Verteilung)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bauen:
    name: ${{ inputs.app }} · ${{ inputs.artefakt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC-Token fuer Workload Identity Federation. Die Organisation
      # verbietet Service-Account-KEYS (iam.disableServiceAccountKeyCreation,
      # seit 18.08.2026 erzwungen) — der Zugang laeuft deshalb schluessellos
      # ueber ein kurzlebiges Token, das nur dieses Repo anfordern kann.
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bun installieren
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: JDK 17 einrichten
        # AGP 8.x/Gradle verlangt 17. Der Runner bringt mehrere JDKs mit;
        # ohne diese Festlegung nimmt Gradle das Standard-JDK, und das ist
        # nicht stabil über Runner-Generationen hinweg.
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Secrets-Datei anlegen
        # lib/config.secrets.ts ist gitignoriert (echter anon-Key), wird aber
        # von lib/config.ts importiert. Anders als im Prüf-Job (dort genügt
        # der Platzhalter) braucht ein RELEASE-Build den ECHTEN Key —
        # sonst hat die App bei den Testern kein Realtime.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secret MOBILE_SUPABASE_ANON_KEY fehlt — ohne echten anon-Key hätte die App kein Realtime."
            exit 1
          fi
          printf 'export const SUPABASE_ANON_KEY =\n  "%s";\n' "$SUPABASE_ANON_KEY" > lib/config.secrets.ts

      - name: Typprüfung
        # Der Prüf-Job in ci.yml läuft nur auf main/PR. Ein Release kann von
        # jedem Ref gestartet werden — also hier erneut prüfen, statt auf
        # einen fremden Lauf zu vertrauen.
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Keystore entpacken
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYNEXTDAYS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret MYNEXTDAYS_RELEASE_KEYSTORE_BASE64 fehlt. Einmalig erzeugen: scripts/mobile/keystore-erzeugen.sh ${{ inputs.app }}"
            exit 1
          fi
          # Ausserhalb des Arbeitsbaums: ein Keystore im Repo-Ordner koennte
          # in ein Artefakt geraten. RUNNER_TEMP wird nach dem Lauf verworfen.
          ziel="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ziel"
          chmod 600 "$ziel"
          # Beweis, dass der Schluessel lesbar ist, BEVOR Gradle 10 Minuten
          # laeuft und erst am Signierschritt scheitert.
          keytool -list -keystore "$ziel" \
            -storepass "${{ secrets.MYNEXTDAYS_RELEASE_STORE_PASSWORD }}" >/dev/null
          echo "pfad=$ziel" >> "$GITHUB_OUTPUT"

      - name: Version aus dem Lauf ableiten
        id: version
        # versionCode MUSS bei jedem Upload steigen, sonst lehnt Play ab und
        # App Distribution zeigt Testern kein Update. `github.run_number` ist
        # monoton und braucht keinen Commit im Repo — deshalb hier statt einer
        # gepflegten Zahl in build.gradle.
        #
        # Die Basis-Version steht in package.json ("version"), NICHT in
        # build.gradle: dort ist versionName seit dem CI-Umbau selbst nur noch
        # `project.findProperty("versionName") ?: "1.0"` — ein sed darauf
        # findet nichts und wuerde den Lauf grundlos abbrechen.
        run: |
          set -euo pipefail
          basis=$(node -p "require('./package.json').version")
          [ -n "$basis" ] || { echo "::error::version fehlt in package.json"; exit 1; }
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$basis+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # `working-directory` am SCHRITT ersetzt den Job-Default, es haengt sich
      # nicht daran an: `android` allein zeigte auf <Wurzel>/android und damit
      # ins Leere ("No such file or directory", erster Lauf 19.08.2026). Der
      # Schritt "An Beta-Tester verteilen" hat bewusst KEIN eigenes
      # working-directory und laeuft daher korrekt im Job-Default.
      - name: Release bauen
        env:
          MYNEXTDAYS_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.pfad }}
          MYNEXTDAYS_RELEASE_STORE_PASSWORD: ${{ secrets.MYNEXTDAYS_RELEASE_STORE_PASSWORD }}
          MYNEXTDAYS_RELEASE_KEY_ALIAS: ${{ secrets.MYNEXTDAYS_RELEASE_KEY_ALIAS }}
          MYNEXTDAYS_RELEASE_KEY_PASSWORD: ${{ secrets.MYNEXTDAYS_RELEASE_KEY_PASSWORD }}
        working-directory: ${{ inputs.app }}/android
        run: |
          set -euo pipefail
          aufgabe=$([ "${{ inputs.artefakt }}" = "aab" ] && echo bundleRelease || echo assembleRelease)
          ./gradlew "$aufgabe" --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Signatur beweisen
        # Ein gebautes Artefakt ist KEIN Beweis, dass es signiert ist:
        # build.gradle ist fail-closed gebaut und liefert bei fehlendem
        # Keystore ein UNSIGNIERTES Release-APK — das installiert kein
        # Telefon. Also nachsehen, statt annehmen (Wurzel 5).
        working-directory: ${{ inputs.app }}/android
        run: |
          set -euo pipefail
          if [ "${{ inputs.artefakt }}" = "aab" ]; then
            datei=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          else
            datei=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          [ -n "$datei" ] || { echo "::error::Kein Artefakt gebaut"; exit 1; }
          echo "Artefakt: $datei ($(du -h "$datei" | cut -f1))"

          # apksigner liegt in build-tools; AABs pruefen wir mit jarsigner,
          # weil apksigner nur APKs kennt.
          if [ "${{ inputs.artefakt }}" = "apk" ]; then
            signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$signer" verify --print-certs "$datei" || {
              echo "::error::Artefakt ist NICHT gueltig signiert — Keystore-Secrets pruefen."; exit 1; }
          else
            jarsigner -verify "$datei" | grep -q 'jar verified' || {
              echo "::error::AAB ist NICHT gueltig signiert."; exit 1; }
          fi
          echo "ziel=$datei" >> "$GITHUB_ENV"

      # ── Verteilung an die Beta-Tester ────────────────────────────────────
      # Nur fuer APK: das AAB ist fuer den Play Store, App Distribution
      # verteilt installierbare Artefakte.
      - name: Bei Google anmelden (schluessellos)
        if: inputs.artefakt == 'apk'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          project_id: project-460d8aaf-4b7d-4d13-b3a
          workload_identity_provider: projects/683362094842/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-mobile-release@project-460d8aaf-4b7d-4d13-b3a.iam.gserviceaccount.com
          # Datei statt nur Env-Var: firebase-tools authentifiziert ueber
          # `autoAuth` (lib/requireAuth.js) mit google-auth-library, und die
          # liest Application Default Credentials aus der Datei, auf die
          # GOOGLE_APPLICATION_CREDENTIALS zeigt. Der `--token`-Weg ist in
          # firebase-tools ausdruecklich deprecated.
          create_credentials_file: true
          export_environment_variables: true

      - name: An Beta-Tester verteilen
        if: inputs.artefakt == 'apk'
        env:
          NOTIZ: ${{ inputs.notiz }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          # Die Notiz landet bei den Testern in der Einladung. Ohne Eingabe
          # den Commit nehmen — ein leeres Feld hilft niemandem, aber eine
          # erfundene Beschreibung waere schlimmer (Wurzel 4).
          notiz="${NOTIZ:-}"
          if [ -z "$notiz" ]; then
            notiz="Build ${{ github.run_number }} · $(git log -1 --pretty=%s)"
          fi
          bunx firebase-tools appdistribution:distribute "$apk" \
            --app 1:683362094842:android:98b6212be46056d2bc0343 \
            --groups beta-tester \
            --release-notes "$notiz" \
            --project project-460d8aaf-4b7d-4d13-b3a

      - name: Artefakt bereitstellen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app }}-${{ steps.version.outputs.name }}-${{ inputs.artefakt }}
          path: ${{ inputs.app }}/android/app/build/outputs/**/*.${{ inputs.artefakt }}
          if-no-files-found: error
          # Kurz halten: ein signiertes Release-Artefakt ist kein Archivgut,
          # und Tester holen es innerhalb von Tagen.
          retention-days: 14
