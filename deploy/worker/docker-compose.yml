# ──────────────────────────────────────────────────────────────────────────
# Background-Worker — arbeitet die jobs-Queue ab, als EIGENSTÄNDIGE Coolify-App.
#
# WARUM GETRENNT VOM DB-STACK (deploy/supabase/): Ein crashender Worker im selben
# Compose-Stack wie die Produktions-Datenbank kann den GANZEN Stack (inkl. DB)
# mitreißen — genau das ist einmal passiert (Worker-Crash-Schleife → Coolify fuhr
# den kompletten Supabase-Stack herunter). Als isolierte App bleibt ein Worker-
# Crash folgenlos für die DB: er restartet nur sich selbst.
#
# Der Worker nimmt KEINEN HTTP-Verkehr an (keine Traefik-Labels, keine Ports). Er
# erreicht Kong (SUPABASE_URL=http://kong:8000) und Redis über das stabile externe
# Netz "supabase-internal" per Servicename — dieselbe Mechanik wie der Kong-Stack.
# Zusätzlich hängt er im Netz "coolify" — NUR AUSGEHEND, um Coolifys API für den
# Deploy-Spiegel zu erreichen (siehe networks beim Service). Eingehend bleibt er
# unerreichbar.
#
# Voraussetzung: redis ist im DB-Stack zusätzlich in supabase-internal (alias
# redis) — siehe deploy/supabase/docker-compose.yml.
# ──────────────────────────────────────────────────────────────────────────
services:
  worker:
    # Baut dasselbe Backend-Image wie der DB-Stack, aber unabhängig — der Worker-
    # Stack hängt nicht am Build-Zeitpunkt des DB-Stacks. Build-Kontext = Repo-Root
    # (Coolify löst relativ zum geklonten Repo auf).
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: nextdays-worker:prod
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    networks:
      # Das stabile externe Netz zu kong/rest/redis.
      - supabase-internal
      # AUSGEHEND zu Coolifys eigener API (Host `coolify`), für den
      # Deploy-Spiegel: der Worker liest den Deploy-Zustand aus Coolify und
      # schreibt ihn nach public.deploy_spiegel, damit das Backoffice ihn per
      # Realtime abonnieren kann. Ohne dieses Netz löst `COOLIFY_API_URL` den
      # Host `coolify` nicht auf, der Job steigt bei jedem Tick aus und der
      # Monitor bleibt leer.
      #
      # Kein Widerspruch zur Regel „Worker braucht keinen Ingress": die gilt
      # für EINGEHENDEN Verkehr (Traefik-Labels, exponierte Ports). Der Worker
      # nimmt weiterhin nichts an — er ruft nur heraus, wie die api es auch tut.
      - coolify
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Parallel verarbeitete Jobs je Worker-Instanz (Concurrency-Pool).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Kong intern im supabase-internal-Netz (wie die api): kein Hairpin.
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      # redis ist über supabase-internal (alias redis) erreichbar.
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      # Channex-Zugang (aus Coolify-Env) — der Worker pusht ARI/Content an Channex.
      CHANNEX_API_KEY: ${CHANNEX_API_KEY:-}
      CHANNEX_BASE_URL: ${CHANNEX_BASE_URL:-}
      CHANNEX_WEBHOOK_SECRET: ${CHANNEX_WEBHOOK_SECRET:-}
      CHANNEX_SANDBOX_PORTALS: ${CHANNEX_SANDBOX_PORTALS:-false}
      # Kontoweites Channex-Budget (Token-Bucket im Worker).
      CHANNEX_ACCOUNT_BUDGET: ${CHANNEX_ACCOUNT_BUDGET:-200/60}
      CHANNEX_PROPERTY_BUDGET: ${CHANNEX_PROPERTY_BUDGET:-20/60}
      # --- Deploy-Spiegel ---------------------------------------------------
      # Coolifys API-Zugang. COOLIFY_TOKEN/COOLIFY_API_URL injiziert Coolify in
      # jeden von ihm verwalteten Container selbst; hier stehen sie trotzdem
      # ausdrücklich, damit die Abhängigkeit sichtbar ist und der Stack auch
      # ausserhalb von Coolify (lokal, anderer Host) lauffähig bleibt.
      COOLIFY_API_URL: ${COOLIFY_API_URL:-}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:-}
      # GitHub für den Rückstand („was liegt zwischen ausgerolltem Stand und
      # main"). Seit der Rückstand im Worker-Tick ermittelt und mitgespiegelt
      # wird (statt bei jedem Seitenaufbau der API), braucht IHN der Worker —
      # bisher hatte nur die api das Token. Fehlt es, bleibt `rueckstand` NULL
      # und die Oberfläche sagt „kein GitHub-Zugang" (kein geratener Nullwert).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
    healthcheck:
      # Echter Liveness-Check: der Run-Loop schreibt je Durchlauf einen Heartbeat
      # (src/worker.py, HEARTBEAT_PATH); ist die Datei älter als 120 s, hängt der
      # Event-Loop → unhealthy. Über python (im Image) — der Worker hat bewusst
      # keinen HTTP-Port, ein Portcheck wäre hier nur ein Fake.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/tmp/worker-heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  # STABILES, benanntes externes Netz zu den Stack-Services (kong/rest/redis).
  # external + name → Coolify legt kein isoliertes neues Netz an, sondern nutzt das
  # vorhandene (sonst Name-Resolution-Fehler). Anlegen (einmalig, falls nicht da):
  # docker network create supabase-internal
  supabase-internal:
    external: true
    name: supabase-internal
  # Coolifys eigenes Netz — von Coolify selbst angelegt, hier nur mitbenutzt.
  # external + name, damit Coolify kein zweites Netz gleichen Namens erzeugt.
  # Ohne diesen Eintrag überlebt der Deploy-Spiegel keinen Worker-Deploy: er
  # lief zuletzt nur, weil das Netz von Hand per `docker network connect
  # coolify worker-…` angehängt worden war — und das ist beim nächsten
  # Neuanlegen des Containers weg.
  coolify:
    external: true
    name: coolify
