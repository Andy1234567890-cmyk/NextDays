# dac7-test.mynextdays.dk → die simulierte Empfangsstelle
#
# WOHIN DAMIT: auf dem zweiten Server (62.238.4.193) nach
#   /opt/mailcow-dockerized/data/conf/nginx/dac7-test.conf
# danach `docker exec mailcowdockerized-nginx-mailcow-1 nginx -s reload`.
#
# WARUM ÜBER MAILCOW UND NICHT ÜBER TRAEFIK: Auf diesem Server hält mailcow
# die Ports 80 und 443 mit einem Catch-all (`server_name _`). Ein zweiter
# Ingress-Proxy daneben wäre ein Konflikt mit dem produktiven Mailverkehr.
# mailcows nginx bringt die Weiterleitung ohne Zusatzsoftware mit — und sein
# acme-Container besorgt das Zertifikat, sofern die Domain in
# ADDITIONAL_SAN steht (mailcow.conf).
#
# VORAUSSETZUNGEN, in dieser Reihenfolge:
#   1. DNS: dac7-test.mynextdays.dk → 62.238.4.193 (A-Record), Proxy AUS.
#      Die Nameserver der Domäne sind CLOUDFLARE (devin/yolanda.ns.
#      cloudflare.com); DanDomain ist nur der Registrar. Der Record wird
#      also bei Cloudflare gesetzt, Zone `mynextdays.dk`.
#      Der Proxy MUSS grau bleiben wie bei mail/sync: Bei orangem Proxy
#      erreicht Let's Encrypt den ACME-Pfad nicht und mailcow bekommt kein
#      Zertifikat.
#   2. In /opt/mailcow-dockerized/mailcow.conf:
#      ADDITIONAL_SAN=dac7-test.mynextdays.dk
#      danach `docker compose up -d acme-mailcow` (holt das Zertifikat).
#   3. Diese Datei ablegen, nginx neu laden.

server {
    listen 80;
    listen [::]:80;
    server_name dac7-test.mynextdays.dk;

    # ACME-Prüfpfad muss über HTTP erreichbar bleiben, sonst kann das
    # Zertifikat nicht erneuert werden.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dac7-test.mynextdays.dk;

    ssl_certificate     /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Eine DAC7-Meldung ist eine kleine Datei; die Teststufe weist alles über
    # 20 MB selbst ab. Hier etwas darüber, damit die ABLEHNUNG vom Dienst
    # kommt (mit lesbarer Begründung) und nicht als nacktes 413 von nginx.
    client_max_body_size 25m;

    # Der Dienst prüft eine Datei Zeile für Zeile. Bei einer großen Meldung
    # dauert das; die Vorgabe von 60 s wäre knapp.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Kein Zwischenspeichern: Jede Einreichung ist ein Einzelvorgang, und
    # eine gepufferte Antwort mit CPR-Bezug hat auf der Platte nichts zu
    # suchen.
    proxy_request_buffering off;
    proxy_buffering off;

    # ZWEITE SCHRANKE: HTTP-Basic vor dem Dienst.
    #
    # Der Dienst prueft selbst `X-Staging-Token` (fail-closed). Diese Schicht
    # kommt DAVOR und schuetzt gegen etwas anderes: Ohne sie liegt eine
    # Empfangsstelle fuer Dateien mit CPR-Nummern offen im Netz, und jeder
    # Scanner sieht an `/docs` und `/openapi.json` sofort, was sie kann.
    # Zwei unabhaengige Schranken, damit ein verlorenes Token nicht reicht.
    auth_basic "DAC7 Teststufe";
    auth_basic_user_file /etc/nginx/conf.d/dac7-test.htpasswd;

    # Der Dienst haengt im mailcow-Netz und ist per CONTAINERNAMEN erreichbar.
    # Vorher stand hier `127.0.0.1:8100` — das zeigte aus dem nginx-Container
    # heraus auf den nginx selbst (502), und die Bruecken-Adresse 172.17.0.1
    # half nicht (504), weil der Port nur an das Loopback des HOSTS gebunden
    # ist. Ueber das gemeinsame Netz braucht es gar keinen veroeffentlichten
    # Port: Der Dienst ist vom Host aus nicht erreichbar, nur von nginx.
    resolver 127.0.0.11 valid=30s;
    set $dac7 "dac7-staging:8000";

    # ACME-Pfad OHNE Basic-Auth: Let's Encrypt kann sich nicht anmelden.
    # Ohne diese Ausnahme scheitert die naechste Erneuerung in 90 Tagen —
    # und zwar still, bis das Zertifikat ablaeuft.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/acme;
    }

    location / {
        proxy_pass http://$dac7;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
