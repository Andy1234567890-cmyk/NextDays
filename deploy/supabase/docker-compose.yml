# deploy/supabase/docker-compose.yml — SELF-HOSTED Supabase-Stack (Production).
#
# Pendant zum lokalen CLI-Stack (supabase/config.toml, `supabase start`), aber
# als explizite, versionierte Compose für den Hetzner-/Coolify-Betrieb (ADR-0010).
#
# Enthaltene Komponenten (wie im CLI-Stack, für Prod gehärtet):
#   Postgres 15 · PostgREST · GoTrue (Auth) · Storage-API · Realtime ·
#   Kong (API-Gateway) · Studio · Meta · Supavisor (Pooler, AKTIV).
#
# Bewusst WEG/AUS gegenüber Dev:
#   - Inbucket (Dev-Mailcatcher) → ersetzt durch echten SMTP (SMTP_* Env)
#   - Analytics/Logflare/Vector → AUS (spart RAM; CX43 = 16 GB, Coolify ~1,5 GB)
#
# Persistenz: benannte Volumes für Postgres-Daten und Storage-Objekte. Auf dem
# Server liegen diese auf dem separaten 200-GB-Volume (Coolify-Mount), nicht auf
# der OS-SSD — siehe ADR-0010 / server-sizing-analyse.md.
#
# Alle Secrets/Keys kommen aus der Umgebung (deploy/.env.example listet die Namen).
# Image-Tags sind gepinnt, damit Deploys reproduzierbar sind.

services:
  db:
    image: supabase/postgres:15.14.1.138
    container_name: supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      # shared_buffers konservativ für 16-GB-Server (Coolify + App + Stack teilen
      # sich den RAM). effective_cache_size moderat. Bei Bedarf hochziehen (ADR-0010).
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_connections=100
      - -c
      - wal_level=logical
    volumes:
      # Persistent Storage als Bind-Mount auf das separate 200-GB-Hetzner-Volume
      # (Coolify-dokumentierte Methode: absoluter Host-Source-Pfad, "No docker
      # volume created"). Coolify expandiert ${VARS} im source NICHT, daher der
      # absolute Mount-Pfad des Volumes. Server-spezifisch — siehe ADR-0010.
      - type: bind
        source: /mnt/HC_Volume_106086998/nextdays/postgres
        target: /var/lib/postgresql/data
    configs:
      # Supabase-DB-Init (läuft nur beim ERSTEN Start eines leeren Datenverz.).
      # Setzt rollen-spezifische Passwörter + interne DB/Schemas (_supabase,
      # _realtime, _supavisor), die das Image NICHT selbst anlegt (verifiziert).
      #
      # WICHTIG: direkt in /docker-entrypoint-initdb.d/ (Standard-Postgres-
      # Mechanismus), NICHT in die Unterordner init-scripts/ oder migrations/ —
      # die gehören dem Image (migrate.sh) und werden separat verarbeitet.
      # zz-Präfix sortiert NACH dem Image-Init (alphabetische Reihenfolge).
      - source: db_supabase_sql
        target: /docker-entrypoint-initdb.d/zz-97-_supabase.sql
      - source: db_roles_sql
        target: /docker-entrypoint-initdb.d/zz-98-roles.sql
      - source: db_jwt_sql
        target: /docker-entrypoint-initdb.d/zz-98-jwt.sql
      - source: db_realtime_sql
        target: /docker-entrypoint-initdb.d/zz-99-realtime.sql
      - source: db_pooler_sql
        target: /docker-entrypoint-initdb.d/zz-99-pooler.sql
    healthcheck:
      # Explizit gegen TCP-Host/Port prüfen, nicht nur den lokalen Socket — sonst
      # meldet pg_isready "healthy", bevor die DB Netzwerk-Connections annimmt,
      # und abhängige Dienste (auth) crashen mit "connection refused".
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U supabase_admin -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4g

  # --- Connection Pooler (Supavisor) — in Prod AKTIV (Dev: pooler disabled) ---
  pooler:
    image: supabase/supavisor:2.9.5
    container_name: supabase-pooler
    restart: unless-stopped
    environment:
      PORT: 4000
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@db:5432/_supabase
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      POOLER_TENANT_ID: ${POOLER_TENANT_ID:-nextdays}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE:-20}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN:-100}
      POOLER_POOL_MODE: transaction
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  rest:
    image: postgrest/postgrest:v14.12
    container_name: supabase-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  auth:
    image: supabase/gotrue:v2.189.0
    container_name: supabase-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      # Echter SMTP statt Inbucket (Prod). Werte aus Coolify-Env.
      # SMTP_PORT braucht IMMER eine Zahl (GoTrue parst int) — Default 587,
      # auch wenn SMTP (noch) nicht konfiguriert ist, sonst crasht der Start.
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-noreply@localhost}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-myNextDays}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  realtime:
    image: supabase/realtime:v2.102.3
    container_name: supabase-realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      # realtime v2.10x verlangt METRICS_JWT_SECRET zwingend (sonst Boot-Crash).
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      RLIMIT_NOFILE: "10000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  storage:
    image: supabase/storage-api:v1.60.4
    container_name: supabase-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: 52428800 # 50 MiB (wie Dev-config.toml)
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      REGION: eu-helsinki
      GLOBAL_S3_BUCKET: stub
    volumes:
      # Bind-Mount aufs 200-GB-Volume (s. db-Service). Absoluter Host-Pfad.
      - type: bind
        source: /mnt/HC_Volume_106086998/nextdays/storage
        target: /var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m

  meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: supabase-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  studio:
    image: supabase/studio:2026.06.03-sha-0bca601
    container_name: supabase-studio
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      # Studio in Prod hinter Basic-Auth/Proxy stellen (Coolify) — Admin-UI.
      AUTH_USERNAME: ${DASHBOARD_USERNAME}
      AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
    depends_on:
      meta:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m

  kong:
    image: kong/kong:3.9.1
    container_name: supabase-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    configs:
      # Kong-Route-Konfiguration über docker-compose configs (Coolify-Methode für
      # Config-Dateien — erzeugt die Datei im Container, kein fragiler Pfad-Mount).
      # Inhalt = top-level configs:-Block am Dateiende (Quelle: deploy/supabase/kong.yml).
      - source: kong_config
        target: /usr/local/kong/kong.yml
    expose:
      # KEIN festes Host-Port-Mapping (8000 ist auf dem Server von Coolify
      # selbst belegt → Konflikt). Coolifys Traefik-Proxy routet extern anhand
      # der Service-Domain auf diesen Container-Port. TLS/Domain via Coolify.
      - "8000"
    depends_on:
      - auth
      - rest
      - realtime
      - storage
      - meta
    deploy:
      resources:
        limits:
          memory: 256m

# ──────────────────────────────────────────────────────────────────────────
# KEIN top-level volumes:-Block. Postgres- und Storage-Daten laufen über
# Bind-Mounts mit ABSOLUTEM Host-Pfad (/mnt/HC_Volume_106086998/nextdays/...)
# auf das separate 200-GB-Hetzner-Volume — Coolifys dokumentierte Persistent-
# Storage-Methode ("Source Path from the host system, no docker volume created").
#
# Warum absolut statt ${DATA_ROOT}: Coolify expandiert ${VARS} im volumes-source
# NICHT (es entstünde ein Named Volume auf der OS-SSD). Der Pfad ist daher
# server-spezifisch und bewusst hier dokumentiert — siehe ADR-0010.
#
# Voraussetzung (Server-Setup, siehe README.md):
#   mkdir -p /mnt/HC_Volume_106086998/nextdays/{postgres,storage,redis}
# ──────────────────────────────────────────────────────────────────────────

# Init-SQL + Kong-Config als docker-compose configs (Coolify erzeugt die Dateien
# im Container). Die DB-Init-Skripte stammen aus dem offiziellen Supabase-docker
# (volumes/db/*) und laufen nur beim ERSTEN Start eines leeren Datenverzeichnisses.
configs:
  # Setzt die Passwörter der rollen-spezifischen DB-User auf ${POSTGRES_PASSWORD}.
  # ROBUST: nur Rollen, die wirklich existieren (DO-Block), sonst bricht psql ab
  # und Folge-Skripte laufen nicht. supabase_functions_admin existiert in diesem
  # Stack NICHT (kein functions/edge-runtime) → würde "role does not exist" werfen.
  db_roles_sql:
    content: |
      \set pgpass `echo "$POSTGRES_PASSWORD"`
      -- Passwort als Session-Setting ablegen: psql-Variablen (:'pgpass') werden
      -- innerhalb von DO $$..$$ NICHT interpoliert, daher der Umweg über
      -- set_config + current_setting im Block.
      SELECT set_config('myapp.pgpass', :'pgpass', false);
      DO $$
      DECLARE
        r text;
        pw text := current_setting('myapp.pgpass');
      BEGIN
        FOREACH r IN ARRAY ARRAY[
          'authenticator','pgbouncer','supabase_auth_admin',
          'supabase_storage_admin','supabase_functions_admin','supabase_read_only_user'
        ]
        LOOP
          IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r) THEN
            EXECUTE format('ALTER USER %I WITH PASSWORD %L', r, pw);
          END IF;
        END LOOP;
      END $$;
  # JWT-Settings auf DB-Ebene.
  db_jwt_sql:
    content: |
      \set jwt_secret `echo "$JWT_SECRET"`
      \set jwt_exp `echo "$JWT_EXP"`
      ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
      ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
  # Interne _supabase-DB (Metadaten für pooler/realtime/logs).
  db_supabase_sql:
    content: |
      \set pguser `echo "$POSTGRES_USER"`
      CREATE DATABASE _supabase WITH OWNER :pguser;
  # _realtime-Schema.
  db_realtime_sql:
    content: |
      \set pguser `echo "$POSTGRES_USER"`
      create schema if not exists _realtime;
      alter schema _realtime owner to :pguser;
  # _supavisor-Schema (Pooler) in der _supabase-DB.
  db_pooler_sql:
    content: |
      \set pguser `echo "$POSTGRES_USER"`
      \c _supabase
      create schema if not exists _supavisor;
      alter schema _supavisor owner to :pguser;
      \c postgres

  # Kong-Gateway-Konfiguration (Quelle/identisch zu deploy/supabase/kong.yml).
  kong_config:
    content: |
      _format_version: "2.1"
      _transform: true

      consumers:
        - username: anon
          keyauth_credentials:
            - key: $SUPABASE_ANON_KEY
        - username: service_role
          keyauth_credentials:
            - key: $SUPABASE_SERVICE_KEY

      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      keyauth_credentials:
        - consumer: anon
          key: $SUPABASE_ANON_KEY
        - consumer: service_role
          key: $SUPABASE_SERVICE_KEY

      services:
        - name: auth-v1-open
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths: ["/auth/v1/verify"]
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths: ["/auth/v1/callback"]
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths: ["/auth/v1/authorize"]
          plugins:
            - name: cors
        - name: auth-v1
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths: ["/auth/v1/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin", "anon"]
        - name: rest-v1
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths: ["/rest/v1/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: true
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin", "anon"]
        - name: realtime-v1
          url: http://realtime:4000/socket/
          routes:
            - name: realtime-v1-all
              strip_path: true
              paths: ["/realtime/v1/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin", "anon"]
        - name: storage-v1
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths: ["/storage/v1/"]
          plugins:
            - name: cors
        - name: meta
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths: ["/pg/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin"]
