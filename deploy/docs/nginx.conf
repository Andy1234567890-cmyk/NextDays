# Statischer Auslieferungs-Server für die API-Referenz (docs.mynextdays.com).
# Nur GET auf statische Dateien — kein Backend, keine Secrets, kein DB-Zugriff.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header: die Doku ist rein statisch, aber wir setzen dennoch
    # konservative Header (kein Framing, kein MIME-Sniffing).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets kurz cachen (die Doku wird bei Deploys neu gebaut).
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
