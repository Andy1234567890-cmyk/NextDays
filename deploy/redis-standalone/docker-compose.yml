# ──────────────────────────────────────────────────────────────────────────
# nextdays-redis — Redis (Cache + Queue-Broker + Rate-Limiter) als EIGENSTÄNDIGE
# Coolify-App, getrennt vom DB-Stack.
#
# WARUM GETRENNT: Coolify deployt einen Compose-Stack als Einheit (kein Rolling-
# Update). Solange redis im DB-Stack lag, fuhr jeder DB-Stack-Deploy auch redis
# neu — und ein Deploy-Race konnte einen zweiten redis daneben starten. Als eigene
# App hat redis seinen eigenen Lebenszyklus.
#
# WICHTIG (Datensicherheit): Der Bind-Mount /mnt/HC_Volume_106086998/nextdays/redis
# ist EXAKT derselbe absolute Host-Pfad wie zuvor im DB-Stack — die AOF-Queue-Daten
# bleiben unverändert erhalten (kein neues Volume, kein Backfill). fester
# container_name + consistent_container_name → Docker verhindert einen zweiten
# redis auf demselben Verzeichnis.
#
# Erreichbar für api + Worker über das externe supabase-internal-Netz per Name.
# ──────────────────────────────────────────────────────────────────────────
services:
  redis:
    image: redis:7-alpine
    container_name: nextdays-redis
    restart: unless-stopped
    # maxmemory < Container-Limit → Redis regelt selbst statt OS-OOM. noeviction:
    # Rate-Limit-/Queue-Daten dürfen nicht still verworfen werden (Auth/Payments
    # fail-closed). Keys sind winzig + laufen per TTL ab, 200m wird nie erreicht.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    networks:
      # Stabiles externes Netz zu api + Worker (beide erreichen "redis" per Name).
      supabase-internal:
        aliases: [redis]
    volumes:
      # EXAKT derselbe absolute Host-Pfad wie zuvor im DB-Stack — Daten bleiben.
      - /mnt/HC_Volume_106086998/nextdays/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

# supabase-internal = das stabile, benannte externe Netz (auch im DB-Stack, api-
# und Worker-Compose). external + name: → Coolify nutzt das vorhandene Netz.
networks:
  supabase-internal:
    external: true
    name: supabase-internal
