# ──────────────────────────────────────────────────────────────────────────
# Kong — API-Gateway des Supabase-Stacks, als EIGENSTÄNDIGE Coolify-App.
#
# Warum getrennt vom Supabase-Stack: Coolify macht für Compose-Stacks KEIN
# Rolling-Update (stop-all → start-all → kurze Downtime). Single-Service-Apps
# mit Healthcheck bekommen dagegen Coolifys Start-before-Stop = echtes
# Zero-Downtime. Kong ist der einzige extern erreichbare Teil → nur Kong braucht
# das. Die Backend-Services (auth/rest/storage/meta/realtime) bleiben im
# Supabase-Stack und werden über das stabile Netz "supabase-internal" per Name
# erreicht (siehe deploy/supabase/docker-compose.yml).
#
# Domain: über Coolify docker_compose_domains für Service "kong" MIT :8000
# (z.B. https://supabase-kong.65.21.144.136.sslip.io:8000). Siehe README.
# ──────────────────────────────────────────────────────────────────────────
services:
  kong:
    image: kong/kong:3.9.1
    container_name: nextdays-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      # DNS-Cache-TTL — KRITISCH für Zero-Downtime nach einem Supabase-Deploy.
      # Kong löst die Upstreams per Hostname auf (http://rest:3000/ etc.). Bei
      # jedem Deploy bekommen die Stack-Container (rest/auth/…) NEUE Docker-IPs.
      # Kongs Default KONG_DNS_STALE_TTL ist 3600s: eine tote Upstream-IP bleibt
      # eine STUNDE im Cache → Kong rennt gegen die alte IP → "connect() failed
      # (111: Connection refused)" → 502 Bad Gateway für ALLE Requests bis der
      # Cache abläuft. Genau dieser Fall trat live auf (Kong 21h alt, rest neu
      # deployt). Kurze TTLs zwingen Kong, die neue IP binnen Sekunden selbst zu
      # finden — ohne manuelles "kong reload". Werte: offizielle Kong-Doku.
      KONG_DNS_STALE_TTL: "10"      # tote IP max. 10s im Cache (Default 3600!)
      KONG_DNS_VALID_TTL: "30"      # gültige IP alle 30s neu prüfen (Default: DNS-TTL)
      KONG_DNS_ERROR_TTL: "1"       # Fehler nur 1s cachen (= Default, explizit)
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    configs:
      - source: kong_config
        target: /usr/local/kong/kong.yml
    expose:
      - "8000"
    labels:
      # Kong hängt in mehreren Netzen (coolify + supabase-internal). Ohne dieses
      # Label wählt Traefik mehrdeutig und erwischt das falsche → HTTPS 000.
      # Erzwingt das coolify-Netz für die Traefik↔Kong-Verbindung.
      - traefik.docker.network=coolify
    # Healthcheck ist die Voraussetzung für Coolifys Rolling-Update: der neue
    # Kong-Container muss healthy sein, BEVOR der alte gestoppt wird.
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      # coolify EXPLIZIT: bei einem eigenen networks:-Block hängt Coolify den
      # Container NICHT automatisch ins coolify-Netz → Traefik erreicht Kong
      # nicht (504/Timeout nach jedem Deploy). Das Label traefik.docker.network
      # allein reicht NICHT — der Container muss tatsächlich im Netz sein.
      - coolify
      # default = Coolify-Stack-Netz (intra-Stack).
      - default
      # supabase-internal = stabiles Netz zu den Stack-Services (auth/rest/…).
      - supabase-internal
    deploy:
      resources:
        limits:
          # ≥1g: bei 256m killte das OS Kongs nginx-Worker (OOM, signal 9) →
          # instabile 502/401. Siehe deploy/supabase/README.md.
          memory: 1g

networks:
  default:
  # Traefik-Proxy-Netz. EXTERN + benannt, damit Kong bei jedem Deploy
  # reproduzierbar darin hängt (sonst 504, s.o.).
  coolify:
    external: true
    name: coolify
  supabase-internal:
    external: true
    name: supabase-internal

configs:
  # Inline content statt file:-Mount — Coolify erzeugt die Datei zuverlässig im
  # Container (file:-Pfade brechen mit base_directory). Identisch zu deploy/kong/kong.yml.
  # ${ANON_KEY}/${SERVICE_ROLE_KEY} interpoliert Compose aus der Coolify-Env.
  kong_config:
    content: |
      _format_version: "2.1"
      _transform: true

      consumers:
        - username: anon
          keyauth_credentials:
            - key: ${ANON_KEY}
        - username: service_role
          keyauth_credentials:
            - key: ${SERVICE_ROLE_KEY}

      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      services:
        - name: auth-v1-open
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths: ["/auth/v1/verify"]
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths: ["/auth/v1/callback"]
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths: ["/auth/v1/authorize"]
          plugins:
            - name: cors
        - name: auth-v1
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths: ["/auth/v1/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin", "anon"]
        - name: rest-v1
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths: ["/rest/v1/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: true
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin", "anon"]
        - name: realtime-v1
          url: http://realtime:4000/socket/
          routes:
            - name: realtime-v1-all
              strip_path: true
              paths: ["/realtime/v1/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin", "anon"]
        - name: storage-v1
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths: ["/storage/v1/"]
          plugins:
            - name: cors
        - name: meta
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths: ["/pg/"]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: ["admin"]
